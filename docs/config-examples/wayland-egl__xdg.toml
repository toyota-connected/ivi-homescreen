# wayland-egl + xdg shell.
# Desktop top-level: no window role, no activation area.
# [global].app_id becomes the xdg_toplevel app id.
[global]
app_id = 'homescreen'
cursor_theme = 'DMZ-White'
disable_cursor = false

[[view]]
width = 1920
height = 1080
output_index = 0
pixel_ratio = 1.0

  [view.args]
  engine = ['--enable-asserts']

  [view.shell]
  type = 'xdg'

  [view.backend]
  type = 'wayland-egl'

# [sentry] — optional, process-level crash reporting (shared by all views).
# The DSN comes from the SENTRY_DSN environment variable; this table only adds
# metadata. Omit the whole table to disable.
[sentry]
release = '1.0.0'
env = 'production'
tags = { board = 'dev-board' }
attachments = []
