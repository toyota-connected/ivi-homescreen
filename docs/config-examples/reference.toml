# config.toml — REFERENCE. Lists every key the parser reads, grouped by
# table, with type / default / valid values / applies-to. This file is a
# reference, NOT runnable as-is: AGL window/activation keys, ivi surface_id
# and the DRM knobs are mutually exclusive by shell/backend. For runnable
# configs see the other files in this directory. Generated by
# scripts/gen_config_reference.py — do not edit by hand.

[global]
  # Application id (xdg app_id / agl); also argv[0] of the engine command line.
  # type=string default=homescreen values=string applies=all
  app_id =

  # XCursor theme name.
  # type=string default=— values=string applies=all
  cursor_theme =

  # Enable backend debug logging.
  # type=bool default=false values=true|false applies=all
  debug_backend =

  # Hide the pointer cursor.
  # type=bool default=false values=true|false applies=all
  disable_cursor =

  # Wayland input events to mask (e.g. 'keyboard pointer').
  # type=string default=— values=comma/space list applies=wayland
  wayland_event_mask =

[sentry]
  # Files attached to crash reports.
  # type=string default=[] values=array<path> applies=all
  attachments =

  # Sentry environment.
  # type=string default=(built-in) values=string applies=all
  env =

  # Sentry release tag.
  # type=string default=— values=string applies=all
  release =

  # Extra Sentry tags.
  # type=string default={} values=table<string,string> applies=all
  tags =

[[view]]
  # FlutterAccessibilityFeature bit mask.
  # type=int default=0 values=int bitmask applies=all
  accessibility_features =

  # Per-view bundle directory; required in a --config master file, implicit from -b otherwise.
  # type=string default=(from -b) values=path applies=--config
  bundle =

  # Start fullscreen.
  # type=bool default=false values=true|false applies=all
  fullscreen =

  # View height in px (fallback; DRM/software adopt the panel mode).
  # type=int default=720 values=int applies=all
  height =

  # wl_output index to place the view on.
  # type=int default=0 values=int applies=all
  output_index =

  # Device pixel ratio override.
  # type=float default=1.0 values=float applies=all
  pixel_ratio =

  # View width in px (fallback; DRM/software adopt the panel mode).
  # type=int default=1920 values=int applies=all
  width =

[view.args]
  # Args to the Dart entrypoint main(List<String>) -> dart_entrypoint_argv.
  # type=array<string> default=[] values=array<string> applies=all
  dart =

  # Engine / Dart VM switches -> FlutterProjectArgs.command_line_argv (app_id prepended as argv[0]).
  # type=array<string> default=[] values=array<string> applies=all
  engine =

[view.shell]
  # ivi-shell numeric surface id.
  # type=int default=— values=int applies=ivi
  surface_id =

  # Wayland compositor-protocol shell.
  # type=string default=auto values=auto|xdg|agl|ivi|simple applies=all
  type =

[view.shell.window]
  # AGL window role.
  # type=string default=NORMAL values=BG|PANEL_TOP|PANEL_BOTTOM|PANEL_LEFT|PANEL_RIGHT|NORMAL applies=agl
  type =

[view.shell.window.activation_area]
  # Activation rect height (omit table -> full view).
  # type=int default=view.height values=int applies=agl
  height =

  # Activation rect width (omit table -> full view).
  # type=int default=view.width values=int applies=agl
  width =

  # Activation rect x (output-relative px).
  # type=int default=0 values=int applies=agl
  x =

  # Activation rect y.
  # type=int default=0 values=int applies=agl
  y =

[view.backend]
  # Renderer backend; unset = auto (Wayland session -> wayland-egl, else drm-kms-egl).
  # type=string default=(env-aware) values=wayland-egl|wayland-vulkan|drm-kms-egl|drm-kms-vulkan|software applies=all
  type =

[view.backend.drm]
  # Allow NONBLOCK|ALLOW_MODESET commits.
  # type=string default=auto values=auto|yes|no applies=drm
  allow_nonblock_modeset =

  # Use PAGE_FLIP_ASYNC on flip-only commits.
  # type=string default=auto values=auto|yes|no applies=drm
  async_flip =

  # Compositor strategy.
  # type=string default=auto values=auto|planes|gl applies=drm
  compositor =

  # Connector to drive.
  # type=string default=(rank-pick) values=e.g. eDP-1, HDMI-A-1 applies=drm/sw
  connector =

  # DRM device node.
  # type=string default=(rank-pick) values=/dev/dri/cardN applies=drm/sw
  device =

  # Use IN_FENCE_FD / OUT_FENCE_PTR.
  # type=string default=auto values=auto|yes|no applies=drm
  explicit_sync =

  # Per-device pointer transforms '<name>=<0|90|180|270>[,flip-x][,flip-y]'.
  # type=array<string> default=[] values=array<string> applies=drm/sw
  input_transforms =

  # Mode; unset = preferred from EDID.
  # type=string default=(preferred) values=<W>x<H>@<R> applies=drm/sw
  mode =

  # Modeset API.
  # type=string default=auto values=auto|legacy|atomic applies=drm
  modeset =

  # Bypass libseat (headless/SSH/kiosk).
  # type=bool default=false values=true|false applies=drm/sw
  no_seat =

  # Use overlay planes.
  # type=string default=auto values=auto|yes|no applies=drm
  overlay_planes =

  # Primary plane format.
  # type=string default=auto values=auto|xrgb8888|xbgr8888|argb8888|abgr8888|rgb565 applies=drm
  primary_format =

  # Scanout rotation in degrees.
  # type=int default=0 values=0|90|180|270 applies=drm
  rotation =

  # Stage HW cursor into the compositor commit (auto = nvidia-drm only).
  # type=string default=auto values=auto|yes|no applies=drm
  stage_cursor =

[view.backend.lease]
  # Connector to request by name; several offers with no choice is fatal.
  # type=string default=(sole offer) values=e.g. HDMI-A-1 applies=leased
  connector =

  # Which wp_drm_lease_device_v1 when several are advertised (one per DRM node); ambiguous + unset is fatal.
  # type=string default=(sole device) values=index or /dev/dri/cardN applies=leased
  device =

  # On revocation (every VT switch away from the compositor is one): exit non-zero so a supervisor restarts and renegotiates, or gate and keep running with a frozen panel (debugging only).
  # type=string default=exit values=exit|gate applies=leased
  on_revoke =

  # Bound on the whole lease negotiation; a compositor may defer the DRM fd until it regains DRM master.
  # type=int default=5000 values=> 0 applies=leased
  timeout_ms =

[view.output]
  # DRM: match this connector name (overrides output.name).
  # type=string default=(none) values=e.g. HDMI-A-1 applies=drm
  drm_connector =

  # Deprecated: match the Nth connected output (prefer a name).
  # type=int default=(none) values=int applies=all
  index =

  # Pin the view to this output by name (fills both the wl_output and DRM connector match).
  # type=string default=(primary) values=e.g. DP-1, HDMI-A-1 applies=all
  name =

  # What to do with the view when its output disappears.
  # type=string default=suspend values=suspend|teardown applies=all
  on_disconnect =

  # Warm the engine (suspended) at startup even if the output is absent.
  # type=bool default=false values=true|false applies=all
  preload =

  # DRM: refine the match to this EDID serial when it is unique.
  # type=string default=(none) values=EDID serial applies=drm
  serial =

  # Route touch from this panel (libinput device-name substring) to this view; unset sends touch to the primary view.
  # type=string default=(primary) values=device-name substring applies=all
  touch_device =

  # Wayland: match this wl_output name (overrides output.name).
  # type=string default=(none) values=e.g. DP-1 applies=wayland
  wl_name =

  # This display's X position in the combined desktop space (multi-display input layout).
  # type=int default=0 values=int (px) applies=all
  x =

  # This display's Y position in the combined desktop space (multi-display input layout).
  # type=int default=0 values=int (px) applies=all
  y =

[view.engine]
  # Run the engine's raster thread on the platform thread (single-thread native/Dart-FFI aliasing).
  # type=bool default=false values=true|false applies=all
  merge_render_platform =

[view.hud]
  # HUD window background opacity.
  # type=float default=0.75 values=float [0,1] applies=all
  bg_alpha =

  # Screen corner the overlay hugs.
  # type=string default=top-left values=top-left|top-right|bottom-left|bottom-right applies=all
  corner =

  # Enable the debug HUD (the IVI_HUD env var also enables it); needs a BUILD_HUD build with the compositor on.
  # type=bool default=false values=true|false applies=all
  enable =

  # Multiplies the base HUD font size.
  # type=float default=1.0 values=float applies=all
  font_scale =

  # Gap from the chosen corner in pixels.
  # type=float default=12 values=float (px) applies=all
  margin =

  # HUD text color.
  # type=string default=#FFFFFF values=#RRGGBB or #RRGGBBAA applies=all
  text_color =
