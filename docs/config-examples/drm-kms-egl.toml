# drm-kms-egl: KMS-direct GLES backend. No Wayland compositor, so no [view.shell].
[global]
app_id = 'homescreen'
disable_cursor = false

[[view]]
# Geometry is normally driven by the connector's mode; width/height act as a
# fallback. fullscreen is implicit for KMS scanout.
fullscreen = true
pixel_ratio = 1.0

  [view.args]
  engine = ['--enable-asserts']

  [view.backend]
  type = 'drm-kms-egl'

    [view.backend.drm]
    device = '/dev/dri/card0'
    connector = 'eDP-1'          # unset = rank-pick
    mode = '1920x1080@60'        # unset = preferred mode from EDID
    rotation = 0                 # 0|90|180|270
    compositor = 'auto'          # auto|planes|gl
    modeset = 'atomic'           # auto|legacy|atomic
    overlay_planes = 'auto'      # auto|yes|no
    explicit_sync = 'auto'       # auto|yes|no
    no_seat = false              # true = bypass libseat (headless/SSH/kiosk)

# [sentry] — optional, process-level crash reporting (shared by all views).
# The DSN comes from the SENTRY_DSN environment variable; this table only adds
# metadata. Omit the whole table to disable.
[sentry]
release = '1.0.0'
env = 'production'
tags = { board = 'dev-board' }
attachments = []
