---
name: ihs-logging-compat-matrix

# Build + runtime-smoke the logging surface across the C++17 / C++20 / C++23
# toolchains so every compat.hpp polyfill is exercised, plus the load harness
# under ThreadSanitizer / AddressSanitizer. Both use the standalone harnesses
# under shell/logging/tests, so they need only a C++ toolchain and libdl — no
# Wayland / Flutter / third_party chain.
#
# The harnesses are tiny (a dozen source files), so the toolchain setup used to
# dominate: the runner images already ship clang, cmake and ninja, so we only
# apt-install a compiler when the pinned version is genuinely absent (clang-12
# on 22.04) and never pull libc++ (the build uses libstdc++).

on:
  pull_request:
    paths:
      - 'cmake/cxx_compat.cmake'
      - 'cmake/logging_helpers.cmake'
      - 'shell/logging/**'
      - '.github/workflows/ihs-logging-compat-matrix.yml'
  push:
    branches:
      - v2.0
      - 'jw/dlt-rebase'
    paths:
      - 'cmake/cxx_compat.cmake'
      - 'cmake/logging_helpers.cmake'
      - 'shell/logging/**'
      - '.github/workflows/ihs-logging-compat-matrix.yml'
  workflow_dispatch:

jobs:
  compat-matrix:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── C++17 floor — exercises every polyfill in compat.hpp (jthread,
          #    expected, format_to snprintf path, flat_map=map). Clang-12 is
          #    not preinstalled on 22.04, so this is the one leg that installs.
          - name: "Clang-12 C++17"
            runner:     ubuntu-22.04
            clang_ver:  12
            cxx_std:    17
            also_no_dlt: false

          # ── C++20 — std::format / std::jthread native; expected/flat_map
          #    still polyfilled. Clang-14 is preinstalled on 22.04.
          - name: "Clang-14 C++20"
            runner:     ubuntu-22.04
            clang_ver:  14
            cxx_std:    20
            also_no_dlt: false

          # ── C++23 — every IHS_HAS_* flag expected ON. Clang-17 is preinstalled
          #    on 24.04. This leg also builds the ENABLE_DLT=OFF variant (the
          #    logging surface minus the DLT sink) in the same job.
          - name: "Clang-17 C++23 (+no-DLT)"
            runner:     ubuntu-24.04
            clang_ver:  17
            cxx_std:    23
            also_no_dlt: true

    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure toolchain
        run: |
          set -eux
          # The runner images ship clang/cmake/ninja; install only what is
          # missing, and never libc++ (the build uses libstdc++).
          if ! command -v clang++-${{ matrix.clang_ver }} >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              clang-${{ matrix.clang_ver }}
          fi
          if ! command -v cmake >/dev/null 2>&1 \
             || ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends cmake ninja-build
          fi
          clang++-${{ matrix.clang_ver }} --version

      - name: Build + run compat_smoke
        run: |
          set -eux
          dlts="ON"
          [ "${{ matrix.also_no_dlt }}" = "true" ] && dlts="ON OFF"
          for dlt in $dlts; do
            b="build/compat-${{ matrix.clang_ver }}-${{ matrix.cxx_std }}-$dlt"
            cmake -GNinja -S shell/logging/tests/compat-matrix -B "$b" \
              -DCMAKE_C_COMPILER=clang-${{ matrix.clang_ver }} \
              -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang_ver }} \
              -DCMAKE_CXX_STANDARD=${{ matrix.cxx_std }} \
              -DENABLE_DLT="$dlt" \
              -DCMAKE_BUILD_TYPE=Debug
            # One line per IHS_HAS_* probe — the point of the matrix.
            grep -E '^IHS_HAS_' "$b/CMakeCache.txt" || true
            cmake --build "$b" -j"$(nproc)"
            ctest --test-dir "$b" --output-on-failure
          done

  # Run the bridge under a real load (ring push -> worker drain -> emit, via the
  # dlt_stub stand-in) under ThreadSanitizer and AddressSanitizer, so a data
  # race or memory error on the concurrent path fails CI. Uses the standalone
  # shell/logging/tests/load harness (toolchain + libdl only).
  dlt-load-sanitizers:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]

    name: "DLT load (${{ matrix.sanitizer }})"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure toolchain
        run: |
          set -eux
          # clang-17 + cmake + ninja are preinstalled on 24.04; install only if
          # missing, and never libc++ (the build uses libstdc++).
          if ! command -v clang++-17 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang-17
          fi
          if ! command -v cmake >/dev/null 2>&1 \
             || ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends cmake ninja-build
          fi

      - name: Configure
        run: |
          set -eux
          cmake -GNinja \
            -S shell/logging/tests/load \
            -B build/load-${{ matrix.sanitizer }} \
            -DCMAKE_C_COMPILER=clang-17 \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"

      - name: Build
        run: |
          set -eux
          cmake --build build/load-${{ matrix.sanitizer }} -j"$(nproc)"

      - name: ctest (dlt_load_smoke)
        working-directory: build/load-${{ matrix.sanitizer }}
        run: |
          set -eux
          ctest --output-on-failure
