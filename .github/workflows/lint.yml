name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [v2.0]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            version: '12'
            cc: gcc-12
            cxx: g++-12
            extra_pkgs: g++-12
          - compiler: gcc
            version: '13'
            cc: gcc-13
            cxx: g++-13
            extra_pkgs: g++-13
          - compiler: gcc
            version: '14'
            cc: gcc-14
            cxx: g++-14
            extra_pkgs: g++-14
          - compiler: clang
            version: '19'
            cc: clang-19
            cxx: clang++-19
            extra_pkgs: clang-19 llvm-19 lld-19 libc++-19-dev libc++abi-19-dev
          - compiler: clang
            version: '20'
            cc: clang-20
            cxx: clang++-20
            extra_pkgs: clang-20 llvm-20 lld-20 libc++-20-dev libc++abi-20-dev

    name: ${{ matrix.compiler }}-${{ matrix.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Update apt package index
        # Refresh the index before cache-apt-pkgs-action resolves versions, so
        # it pins the revision currently on the mirror rather than a stale one
        # the runner image still lists (a dropped .deb 404s and aborts install).
        run: sudo apt-get update

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ninja-build libwayland-dev wayland-protocols libxkbcommon-dev mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils libglib2.0-dev libpugixml-dev ${{ matrix.extra_pkgs }}
          version: 1.0

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -GNinja \
            -B ${{github.workspace}}/build \
            -D CMAKE_BUILD_TYPE=Debug \
            -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D BUILD_NUMBER=${GITHUB_RUN_ID}

      - name: Build
        run: ninja -C ${{github.workspace}}/build

  lint-build:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    name: lint-build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Update apt package index
        # Refresh the index before cache-apt-pkgs-action resolves versions, so
        # it pins the revision currently on the mirror rather than a stale one
        # the runner image still lists (a dropped .deb 404s and aborts install).
        run: sudo apt-get update

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ninja-build libwayland-dev wayland-protocols libxkbcommon-dev mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils libglib2.0-dev libpugixml-dev libdrm-dev libgbm-dev libinput-dev libudev-dev libseat-dev libxcursor-dev clang-19 clang-tidy-19 clang-format-19 llvm-19 lld-19 libc++-19-dev libc++abi-19-dev
          version: 1.0

      - name: Setup libdisplay-info (system or from-source)
        uses: ./.github/actions/setup-libdisplay-info

      # Configure with ALL backends + the compositor enabled so
      # compile_commands.json contains every backend's sources. clang-tidy lints
      # whatever is in compile_commands.json, so this gives full coverage in a
      # single pass (instead of one tidy run per backend combination).
      - name: Configure (all backends)
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          cmake -GNinja \
            -B ${{github.workspace}}/build \
            -D CMAKE_BUILD_TYPE=Debug \
            -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D BUILD_BACKEND_WAYLAND_EGL=ON \
            -D BUILD_BACKEND_WAYLAND_VULKAN=ON \
            -D BUILD_BACKEND_DRM_KMS_EGL=ON \
            -D BUILD_BACKEND_DRM_KMS_VULKAN=ON \
            -D BUILD_BACKEND_SOFTWARE=ON \
            -D BUILD_COMPOSITOR=ON \
            -D BUILD_NUMBER=${GITHUB_RUN_ID}

      - name: Build (generate compile_commands.json)
        run: ninja -C ${{github.workspace}}/build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ${{github.workspace}}/build
          retention-days: 1

  lint-format:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    name: lint-format
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Update apt package index
        # Refresh the index before cache-apt-pkgs-action resolves versions, so
        # it pins the revision currently on the mirror rather than a stale one
        # the runner image still lists (a dropped .deb 404s and aborts install).
        run: sudo apt-get update

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ninja-build clang-format-19
          version: 1.0

      - name: clang-format
        run: scripts/format.sh --check

      - name: config reference (parser table + --help in sync)
        run: python3 scripts/gen_config_reference.py --check

  lint-tidy:
    if: ${{ github.server_url == 'https://github.com' }}
    needs: lint-build
    runs-on: ubuntu-24.04
    name: lint-tidy-${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Update apt package index
        run: sudo apt-get update

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ninja-build libwayland-dev wayland-protocols libxkbcommon-dev mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils libglib2.0-dev libpugixml-dev libdrm-dev libgbm-dev libinput-dev libudev-dev libseat-dev libxcursor-dev clang-19 clang-tidy-19 clang-format-19 llvm-19 lld-19 libc++-19-dev libc++abi-19-dev
          version: 1.0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ${{github.workspace}}/build

      - name: clang-tidy (${{ matrix.shard }}/4)
        run: scripts/clang_tidy.sh --shard ${{ matrix.shard }}/4 ${{github.workspace}}/build
