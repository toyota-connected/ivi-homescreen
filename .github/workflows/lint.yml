name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [v2.0]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            version: '12'
            cc: gcc-12
            cxx: g++-12
            extra_pkgs: g++-12
          - compiler: gcc
            version: '13'
            cc: gcc-13
            cxx: g++-13
            extra_pkgs: g++-13
          - compiler: gcc
            version: '14'
            cc: gcc-14
            cxx: g++-14
            extra_pkgs: g++-14
          - compiler: clang
            version: '19'
            cc: clang-19
            cxx: clang++-19
            extra_pkgs: clang-19 llvm-19 lld-19 libc++-19-dev libc++abi-19-dev
          - compiler: clang
            version: '20'
            cc: clang-20
            cxx: clang++-20
            extra_pkgs: clang-20 llvm-20 lld-20 libc++-20-dev libc++abi-20-dev

    name: ${{ matrix.compiler }}-${{ matrix.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Update apt package index
        # Refresh the index before cache-apt-pkgs-action resolves versions, so
        # it pins the revision currently on the mirror rather than a stale one
        # the runner image still lists (a dropped .deb 404s and aborts install).
        run: sudo apt-get update

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ninja-build libwayland-dev wayland-protocols libxkbcommon-dev mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils libglib2.0-dev libpugixml-dev ${{ matrix.extra_pkgs }}
          version: 1.0

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -GNinja \
            -B ${{github.workspace}}/build \
            -D CMAKE_BUILD_TYPE=Debug \
            -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D BUILD_NUMBER=${GITHUB_RUN_ID}

      - name: Build
        run: ninja -C ${{github.workspace}}/build

  lint-build:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    name: lint-build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Update apt package index
        # Refresh the index before cache-apt-pkgs-action resolves versions, so
        # it pins the revision currently on the mirror rather than a stale one
        # the runner image still lists (a dropped .deb 404s and aborts install).
        run: sudo apt-get update

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ninja-build libwayland-dev wayland-protocols libxkbcommon-dev mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils libglib2.0-dev libpugixml-dev libdrm-dev libgbm-dev libinput-dev libudev-dev libseat-dev libxcursor-dev clang-19 clang-tidy-19 clang-format-19 llvm-19 lld-19 libc++-19-dev libc++abi-19-dev
          version: 1.0

      - name: Setup libdisplay-info (system or from-source)
        uses: ./.github/actions/setup-libdisplay-info

      # Configure with ALL backends + the compositor enabled so
      # compile_commands.json contains every backend's sources. clang-tidy lints
      # whatever is in compile_commands.json, so this gives full coverage in a
      # single pass (instead of one tidy run per backend combination).
      - name: Configure (all backends)
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          cmake -GNinja \
            -B ${{github.workspace}}/build \
            -D CMAKE_BUILD_TYPE=Debug \
            -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D BUILD_BACKEND_WAYLAND_EGL=ON \
            -D BUILD_BACKEND_WAYLAND_VULKAN=ON \
            -D BUILD_BACKEND_DRM_KMS_EGL=ON \
            -D BUILD_BACKEND_DRM_KMS_VULKAN=ON \
            -D BUILD_BACKEND_SOFTWARE=ON \
            -D BUILD_COMPOSITOR=ON \
            -D BUILD_NUMBER=${GITHUB_RUN_ID}

      - name: Build (generate compile_commands.json)
        run: ninja -C ${{github.workspace}}/build

      # Pack into a tar before upload. actions/upload-artifact dereferences
      # symlinks (turning them into real copies), which breaks the build tree:
      # third_party/drm-cxx exposes its src/ headers under a drm-cxx/ prefix via
      # a build/third_party/drm-cxx/include/drm-cxx -> ../../../../third_party/drm-cxx/src
      # symlink. Both that symlink and src/ are on the include path, so #pragma
      # once only dedupes them while they resolve to the same physical file. If
      # the symlink is materialized into a copy, the two paths become distinct
      # files and clang-tidy reports redefinition errors. tar preserves symlinks.
      - name: Pack workspace (preserve symlinks)
        run: tar -C ${{github.workspace}} -czf ${{runner.temp}}/build.tar.gz .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: ${{runner.temp}}/build.tar.gz
          retention-days: 1
          archive: false

  lint-format:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    name: lint-format
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Update apt package index
        # Refresh the index before cache-apt-pkgs-action resolves versions, so
        # it pins the revision currently on the mirror rather than a stale one
        # the runner image still lists (a dropped .deb 404s and aborts install).
        run: sudo apt-get update

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ninja-build clang-format-19
          version: 1.0

      - name: clang-format
        run: scripts/format.sh --check

      - name: config reference (parser table + --help in sync)
        run: python3 scripts/gen_config_reference.py --check

  lint-tidy-shard:
    if: ${{ github.server_url == 'https://github.com' }}
    needs: lint-build
    runs-on: ubuntu-24.04
    name: lint-tidy (${{ matrix.part }}/4)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, part: 1 }
          - { shard: 1, part: 2 }
          - { shard: 2, part: 3 }
          - { shard: 3, part: 4 }
    permissions:
      contents: read

    steps:
      - name: Update apt package index
        run: sudo apt-get update

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ninja-build libwayland-dev wayland-protocols libxkbcommon-dev mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils libglib2.0-dev libpugixml-dev libdrm-dev libgbm-dev libinput-dev libudev-dev libseat-dev libxcursor-dev clang-19 clang-tidy-19 clang-format-19 llvm-19 lld-19 libc++-19-dev libc++abi-19-dev
          version: 1.0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build
          path: ${{runner.temp}}

      - name: Unpack workspace (restore symlinks)
        run: tar -C ${{github.workspace}} -xzf ${{runner.temp}}/build.tar.gz

      - name: clang-tidy
        run: scripts/clang_tidy.sh --shard ${{ matrix.shard }}/4 ${{github.workspace}}/build

      # Delete the uploaded build artifacts even if the job fails, so they don't accumulate in the workflow's artifact storage.
      - name: Cleanup build artifacts
        if: ${{ always() }} 
        uses: geekyeggo/delete-artifact@v6
        with:
            name: build

  lint-tidy:
    name: lint-tidy (gate)
    needs: [ lint-tidy-shard ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check that all shards passed
        run: |
          if [[ ${{ needs.lint-tidy-shard.result }} != 'success' ]]; then
            echo "One or more lint-tidy shards failed; see the logs above."
            exit 1
          else
            echo "All lint-tidy shards passed."
          fi
    
