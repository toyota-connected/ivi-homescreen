---
name: ivi-homescreen

on:
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
  release:
    types: [ published, created, edited ]
  workflow_dispatch:
  schedule:
    # daily
    - cron:  '0 0 * * *'

jobs:
  ivi-homescreen:
    name: ivi-homescreen
    if: ${{ github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' && always() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Update apt package index
        # cache-apt-pkgs-action resolves package versions before it runs its
        # own apt update, so it pins whatever the runner image's stale index
        # lists. When Ubuntu supersedes a revision and drops the old .deb from
        # the mirror (e.g. libinput 1.25.0-1ubuntu3.4), that pinned fetch 404s
        # and aborts the whole install. Refresh the index up front so it pins
        # the version currently on the mirror.
        run: sudo apt-get update
      - name: Install build deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            ninja-build
            libwayland-dev wayland-protocols libxkbcommon-dev libpugixml-dev
            mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils

      - name: Show toolchain versions
        run: |
          cmake --version
          gcc --version

      - name: Configure Debug
        run: |
          mkdir -p ${{github.workspace}}/build/debug
          cmake -GNinja \
            -B ${{github.workspace}}/build/debug \
            -D CMAKE_BUILD_TYPE=Debug \
            -D CMAKE_STAGING_PREFIX=${{github.workspace}}/build/staging/usr/local \
            -D BUILD_NUMBER=${GITHUB_RUN_ID} \
            -D CMAKE_VERBOSE_MAKEFILE=ON

      - name: Build Debug Package
        working-directory: ${{github.workspace}}/build/debug
        run: |
          rm -rf _packages || true
          ninja -C . package
          ls -la _packages

      - name: Publish Debug Artifact TGZ
        uses: actions/upload-artifact@v7
        with:
          name: homescreen-dbg.Linux.tar.gz.zip
          path: |
            build/debug/_packages/homescreen-dbg-*-Linux.tar.gz

      - name: Publish Debug Artifact Debian
        uses: actions/upload-artifact@v7
        with:
          name: homescreen-dbg.amd64.deb.zip
          path: |
            build/debug/_packages/homescreen-dbg*_amd64.*deb

      - name: Publish Debug Artifact RPM
        uses: actions/upload-artifact@v7
        with:
          name: homescreen-dbg.x86_64.rpm.zip
          path: |
            build/debug/_packages/homescreen-dbg-*.x86_64.rpm

      - name: Configure Release
        run: |
          mkdir -p ${{github.workspace}}/build/release
          cmake -GNinja \
            -B ${{github.workspace}}/build/release \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_STAGING_PREFIX=${{github.workspace}}/build/staging/usr/local \
            -D BUILD_NUMBER=${GITHUB_RUN_ID} \
            -D CMAKE_VERBOSE_MAKEFILE=ON

      - name: Build Release Package
        working-directory: ${{github.workspace}}/build/release
        run: |
          rm -rf _packages || true
          ninja -C . package
          ls -la _packages
          echo "Release Info"
          ls -la shell/homescreen
          echo "Strip executable"
          strip shell/homescreen
          ls -la shell/homescreen
          echo "List Dependencies"
          ldd shell/homescreen

      - name: Publish Release Artifact TGZ
        uses: actions/upload-artifact@v7
        with:
          name: homescreen-Linux.tar.gz.zip
          path: |
            build/release/_packages/homescreen-*-Linux.tar.gz

      - name: Publish Release Artifact Debian
        uses: actions/upload-artifact@v7
        with:
          name: homescreen-amd64.deb.zip
          path: |
            build/release/_packages/homescreen_*_amd64.deb

      - name: Publish Release Artifact RPM
        uses: actions/upload-artifact@v7
        with:
          name: homescreen-x86_64.rpm.zip
          path: |
            build/release/_packages/homescreen-*.x86_64.rpm

  # The accessibility semantics tree is off by default (BUILD_ACCESSIBILITY).
  # Compile it here so the opt-in path -- the AccessibilityTree subsystem and
  # its engine/view wiring -- does not bit-rot. No extra dependencies, so this
  # reuses the lightweight ninja build rather than the workspace action.
  accessibility:
    name: accessibility (BUILD_ACCESSIBILITY=ON)
    if: ${{ github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' && always() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Update apt package index
        # cache-apt-pkgs-action resolves package versions before it runs its
        # own apt update, so it pins whatever the runner image's stale index
        # lists. When Ubuntu supersedes a revision and drops the old .deb from
        # the mirror (e.g. libinput 1.25.0-1ubuntu3.4), that pinned fetch 404s
        # and aborts the whole install. Refresh the index up front so it pins
        # the version currently on the mirror.
        run: sudo apt-get update
      - name: Install build deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            ninja-build
            libwayland-dev wayland-protocols libxkbcommon-dev libpugixml-dev
            mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils

      - name: Configure (accessibility enabled)
        run: |
          cmake -GNinja \
            -B ${{github.workspace}}/build/accessibility \
            -D CMAKE_BUILD_TYPE=Debug \
            -D BUILD_ACCESSIBILITY=ON \
            -D CMAKE_STAGING_PREFIX=${{github.workspace}}/build/staging/usr/local \
            -D BUILD_NUMBER=${GITHUB_RUN_ID}

      - name: Build
        working-directory: ${{github.workspace}}/build/accessibility
        run: ninja -C . homescreen

  # The AccessKit bridge is off by default and needs bindings that are not a
  # system package, so nothing else here compiles it. Every defect found in
  # that adapter so far has been a silent one -- a tree of nameless static
  # text, a live region that never announced, a write path that dropped every
  # request -- which is exactly the class a build-and-test leg catches and a
  # reviewer does not.
  #
  # Uses the upstream release rather than the .emb augment: the augment builds
  # the crate from source to give board targets an aarch64 library, which
  # needs a Rust toolchain, while the release ships a prebuilt x86_64 static
  # library that this runner can use directly.
  accesskit:
    name: accesskit (BUILD_ACCESSKIT=ON)
    if: ${{ github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' && always() }}
    runs-on: ubuntu-22.04
    env:
      ACCESSKIT_VERSION: "0.22.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Update apt package index
        # See the accessibility job: the cache action pins versions from the
        # runner's stale index, which 404s once a revision is superseded.
        run: sudo apt-get update
      - name: Install build deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            ninja-build
            libwayland-dev wayland-protocols libxkbcommon-dev libpugixml-dev
            mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils

      # The bindings are a pinned release, so they are fetched once and then
      # restored from cache. The key carries the version, so a bump misses and
      # re-downloads while everything else keeps hitting.
      - name: Cache the AccessKit C bindings
        id: accesskit-cache
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/.deps/accesskit-c-${{env.ACCESSKIT_VERSION}}
          key: accesskit-c-${{env.ACCESSKIT_VERSION}}-${{runner.os}}

      - name: Fetch the AccessKit C bindings
        if: steps.accesskit-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${{github.workspace}}/.deps"
          # Retried patiently, not quickly. github.com returns 503 for this
          # release often enough that it has failed the job twice; the first
          # attempt at hardening gave up after about fifteen seconds, which is
          # shorter than the outages actually last. --retry-max-time bounds
          # the whole attempt instead, and omitting --retry-delay lets curl
          # back off exponentially rather than hammering at a fixed interval.
          #
          # Matches what the oras fetch already does. The two are the same
          # problem and should not drift apart again.
          curl -fsSL --retry 8 --retry-all-errors --retry-max-time 300 \
            --connect-timeout 15 \
            -o "${RUNNER_TEMP}/accesskit-c.zip" \
            "https://github.com/AccessKit/accesskit-c/releases/download/${ACCESSKIT_VERSION}/accesskit-c-${ACCESSKIT_VERSION}.zip"
          unzip -q "${RUNNER_TEMP}/accesskit-c.zip" -d "${{github.workspace}}/.deps"

      - name: Check the bindings are usable
        run: |
          set -euo pipefail
          # accesskit-config.cmake sits at the top of the archive, so this is
          # what find_package(ACCESSKIT) resolves against. Checked on the
          # cached path too, so a truncated or half-written cache entry fails
          # here rather than as a confusing configure error.
          test -f "${{github.workspace}}/.deps/accesskit-c-${ACCESSKIT_VERSION}/accesskit-config.cmake"
          test -f "${{github.workspace}}/.deps/accesskit-c-${ACCESSKIT_VERSION}/lib/linux/x86_64/static/libaccesskit.a"

      - name: Configure (AccessKit enabled)
        run: |
          cmake -GNinja \
            -B ${{github.workspace}}/build/accesskit \
            -D CMAKE_BUILD_TYPE=Debug \
            -D BUILD_ACCESSIBILITY=ON \
            -D BUILD_ACCESSKIT=ON \
            -D BUILD_UNIT_TESTS=ON \
            -D CMAKE_PREFIX_PATH="${{github.workspace}}/.deps/accesskit-c-${ACCESSKIT_VERSION}" \
            -D CMAKE_STAGING_PREFIX=${{github.workspace}}/build/staging/usr/local \
            -D BUILD_NUMBER=${GITHUB_RUN_ID}

      - name: Generate Wayland protocol headers
        # The unit-test targets compile the Wayland sources without depending
        # on the scanner targets, so ninja will otherwise compile them before
        # the headers exist.
        working-directory: ${{github.workspace}}/build/accesskit
        run: |
          ninja $(ninja -t targets all \
            | grep -oE "^shell/wayland-protocols/[a-z0-9_]+\.hpp" \
            | sort -u | tr '\n' ' ')

      - name: Build
        working-directory: ${{github.workspace}}/build/accesskit
        run: ninja

      - name: Test
        working-directory: ${{github.workspace}}/build/accesskit
        # The whole suite, not just the AccessKit cases: enabling the bridge
        # changes what the shell links and registers, so a regression it
        # causes may well surface somewhere else.
        run: ctest --output-on-failure

  # Path-gate the (expensive) crash-handler build: it is a full
  # BUILD_CRASH_HANDLER=ON compile, so it only needs to run when build inputs
  # change. Docs/asset-only PRs skip it. Non-PR events (schedule / release /
  # workflow_dispatch) always run it.
  changes:
    if: ${{ github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      crash_handler: ${{ steps.filter.outputs.crash_handler }}
      watchdog: ${{ steps.filter.outputs.watchdog }}
    steps:
      - name: Detect feature-relevant changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Non-PR event (${{ github.event_name }}) — running crash-handler."
            echo "crash_handler=true" >> "$GITHUB_OUTPUT"
            echo "watchdog=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')
          echo "Changed files:"; echo "$files"
          if echo "$files" | grep -qE '(^cmake/|\.cmake$|CMakeLists\.txt$|^shell/|^plugins/|^third_party/|^\.github/workflows/oss-ivi-homescreen\.yml$)'; then
            echo "crash_handler=true" >> "$GITHUB_OUTPUT"
            echo "watchdog=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs/assets changed — skipping crash-handler."
            echo "crash_handler=false" >> "$GITHUB_OUTPUT"
            echo "watchdog=false" >> "$GITHUB_OUTPUT"
          fi

  crash-handler:
    needs: changes
    if: ${{ github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' && needs.changes.outputs.crash_handler == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      # Build the PR's own source with the crash handler enabled, via emb's
      # native `local` build (no --target). emb pulls the sentry-native augment
      # into a per-workspace overlay and wires it onto the embedder configure,
      # so this needs no setup-workspace / pinned checkout — it compiles exactly
      # the code under review.
      - name: Checkout ivi-homescreen (PR)
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Update apt package index
        # cache-apt-pkgs-action resolves package versions before it runs its
        # own apt update, so it pins whatever the runner image's stale index
        # lists. When Ubuntu supersedes a revision and drops the old .deb from
        # the mirror (e.g. libinput 1.25.0-1ubuntu3.4), that pinned fetch 404s
        # and aborts the whole install. Refresh the index up front so it pins
        # the version currently on the mirror.
        run: sudo apt-get update
      - name: Install build deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            build-essential cmake ninja-build pkg-config git python3
            curl ca-certificates xz-utils
            libxkbcommon-dev libwayland-dev wayland-protocols
            libegl1-mesa-dev libgles2-mesa-dev mesa-common-dev
            libdrm-dev libgbm-dev libinput-dev libudev-dev libseat-dev
            libpugixml-dev libcurl4-openssl-dev
      - name: Fetch emb
        run: git clone --depth 1 https://github.com/toyota-connected/emb_cli.git emb_cli
      # Same reasoning as the watchdog job: the engine is a download, and an
      # uncached one fails the build as "Bundle failed" with no engine in it.
      - name: Restore emb engine artifacts
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/emb/store/engine
          key: emb-engine-x86_64
          restore-keys: |
            emb-engine-x86_64-
      - name: Build crash handler (emb local, software backend)
        run: |
          eval "$(./emb_cli/bootstrap.sh --shellenv)"
          emb --version
          emb -v cross . --backend software \
            -D BUILD_CRASH_HANDLER=ON --build
      # Only save a cache that has something in it. The save runs on failure
      # on purpose -- a run whose fetch died partway should still leave the
      # next one better off -- but a run that fetched *nothing* would
      # otherwise store an empty directory, and since the restore takes the
      # newest prefix match that empty entry becomes what every later run
      # restores. A cache added to break a deadlock would then cause one.
      - name: Check the engine artifacts landed
        if: always()
        id: engine_present
        run: |
          if find ~/.cache/emb/store/engine -name 'libflutter_engine.so' \
               -print -quit 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no engine artifacts to cache"
          fi

      - name: Save emb engine artifacts
        if: always() && steps.engine_present.outputs.present == 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/emb/store/engine
          key: emb-engine-x86_64-${{ github.run_id }}

  # Aggregate gate so crash-handler can be a required status check even though
  # it is path-gated (skipped on docs/asset-only PRs). This job always runs and
  # passes when crash-handler succeeded OR was skipped, and fails only when
  # crash-handler actually failed/was cancelled. Branch protection requires
  # THIS context instead of crash-handler so a legitimate skip never blocks a
  # PR while a real failure still does.
  crash-handler-gate:
    needs: crash-handler
    if: ${{ always() && github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Require crash-handler to pass or be skipped
        shell: bash
        run: |
          result="${{ needs.crash-handler.result }}"
          echo "crash-handler result: ${result}"
          if [ "${result}" = "success" ] || [ "${result}" = "skipped" ]; then
            exit 0
          fi
          echo "::error::crash-handler did not pass (result=${result})"
          exit 1

  watchdog:
    needs: changes
    if: ${{ github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' && needs.changes.outputs.watchdog == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ivi-homescreen (PR)
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Update apt package index
        # cache-apt-pkgs-action resolves package versions before it runs its
        # own apt update, so it pins whatever the runner image's stale index
        # lists. When Ubuntu supersedes a revision and drops the old .deb from
        # the mirror (e.g. libinput 1.25.0-1ubuntu3.4), that pinned fetch 404s
        # and aborts the whole install. Refresh the index up front so it pins
        # the version currently on the mirror.
        run: sudo apt-get update
      - name: Install build deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            build-essential cmake ninja-build pkg-config git python3
            curl ca-certificates xz-utils
            libxkbcommon-dev libwayland-dev wayland-protocols
            libegl1-mesa-dev libgles2-mesa-dev mesa-common-dev
            libdrm-dev libgbm-dev libinput-dev libudev-dev libseat-dev
            libpugixml-dev libcurl4-openssl-dev
      - name: Fetch emb
        run: git clone --depth 1 https://github.com/toyota-connected/emb_cli.git emb_cli
      # The engine artifacts are a download like any other, and this job had
      # no cache for them at all -- so every run refetched them, and a run
      # where that fetch failed produced a bundle with no libflutter_engine.so
      # and a "Bundle failed" that reads like a build error.
      #
      # Restore and save are split, and the save runs on failure, because a
      # cache that exists to make a fetch survivable has to be written on the
      # path where the fetch went wrong -- otherwise it only ever helps runs
      # that did not need it.
      - name: Restore emb engine artifacts
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/emb/store/engine
          key: emb-engine-x86_64
          restore-keys: |
            emb-engine-x86_64-
      - name: Build watchdog
        run: |
          eval "$(./emb_cli/bootstrap.sh --shellenv)"
          emb --version
          emb -v cross . --backend software \
            -D BUILD_WATCHDOG=ON \
            --build
      # Only save a cache that has something in it. The save runs on failure
      # on purpose -- a run whose fetch died partway should still leave the
      # next one better off -- but a run that fetched *nothing* would
      # otherwise store an empty directory, and since the restore takes the
      # newest prefix match that empty entry becomes what every later run
      # restores. A cache added to break a deadlock would then cause one.
      - name: Check the engine artifacts landed
        if: always()
        id: engine_present
        run: |
          if find ~/.cache/emb/store/engine -name 'libflutter_engine.so' \
               -print -quit 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no engine artifacts to cache"
          fi

      - name: Save emb engine artifacts
        if: always() && steps.engine_present.outputs.present == 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/emb/store/engine
          key: emb-engine-x86_64-${{ github.run_id }}
      - name: Install build deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            libsystemd-dev
      - name: Build SystemD watchdog
        run: |
          eval "$(./emb_cli/bootstrap.sh --shellenv)"
          emb --version
          emb -v cross . --backend software \
            -D BUILD_WATCHDOG=ON \
            -D BUILD_SYSTEMD_WATCHDOG=ON \
            --build

  # Unit-test + coverage-capture job.
  #
  # Runs once per backend from the collect-backends matrix. Reads
  # .emb/base.emb.yaml to resolve cmake flags for the current backend.
  # Builds the full unit-test suite with -DCOVERAGE=ON, runs CTest and the
  # *_test_driver binaries, captures per-file line/branch/function data with
  # lcov, filters out third-party and test sources, and uploads coverage.info
  # as an artifact for the subsequent coverage-merge job.
  # All legs run on ubuntu-24.04, which satisfies both the DRM backend
  # requirements (libdrm-dev, libgbm-dev, etc.) and the wayland/software ones.
  unit-tests:
    if: ${{ github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' && always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Update apt package index
        # Refresh the index before cache-apt-pkgs-action resolves versions, so
        # it pins the revision currently on the mirror rather than a stale one
        # the runner image still lists (a dropped .deb 404s and aborts install).
        run: sudo apt-get update

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ninja-build libwayland-dev wayland-protocols libxkbcommon-dev mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils libglib2.0-dev libpugixml-dev libdrm-dev libgbm-dev libinput-dev libudev-dev libseat-dev libxcursor-dev clang-19 clang-tidy-19 clang-format-19 llvm-19 lld-19 libc++-19-dev libc++abi-19-dev
          version: 1.0

      - name: Update apt package index
        # Refresh the index before cache-apt-pkgs-action resolves versions, so
        # it pins the revision currently on the mirror rather than a stale one
        # the runner image still lists (a dropped .deb 404s and aborts install).
        run: sudo apt-get update

      - name: Install extra dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            libdrm-dev libgbm-dev
            libinput-dev libudev-dev libseat-dev libxcursor-dev
            libsystemd-dev libpugixml-dev libcurl4-openssl-dev
          version: 1.0-extra

      - name: Setup libdisplay-info
        uses: ./.github/actions/setup-libdisplay-info

      - name: Configure (coverage)
        run: |
          cmake -GNinja \
            -B ${{github.workspace}}/build/unit-tests \
            -D CMAKE_BUILD_TYPE=Debug \
            -D BUILD_UNIT_TESTS=ON \
            -D COVERAGE=ON \
            -D CMAKE_STAGING_PREFIX=${{github.workspace}}/build/staging/usr/local \
            -D BUILD_NUMBER=${GITHUB_RUN_ID} \
            -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D BUILD_BACKEND_WAYLAND_EGL=ON \
            -D BUILD_BACKEND_WAYLAND_VULKAN=ON \
            -D BUILD_BACKEND_DRM_KMS_EGL=ON \
            -D BUILD_BACKEND_DRM_KMS_VULKAN=ON \
            -D BUILD_BACKEND_SOFTWARE=ON \
            -D BUILD_COMPOSITOR=ON \
            -D BUILD_ACCESSIBILITY=ON \
            -D BUILD_CRASH_HANDLER=OFF \
            -D BUILD_WATCHDOG=ON \
            -D BUILD_SYSTEMD_WATCHDOG=ON

      - name: Build
        working-directory: ${{github.workspace}}/build/unit-tests
        run: ninja -C .

      - name: Install unit test deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: lcov
          version: 1.0-unit_test

      - name: Run unit tests (CTest)
        working-directory: ${{github.workspace}}/build/unit-tests
        run: ctest --output-on-failure --test-dir .

      - name: Capture coverage data
        working-directory: ${{github.workspace}}/build/unit-tests
        run: |
          lcov -d . -c --rc lcov_branch_coverage=1 --ignore-errors mismatch -o coverage.info
          lcov -r coverage.info \
            '*/test/*' '*/usr/*' '*/third_party/*' '*/wayland-protocols/*' \
            --rc lcov_branch_coverage=1 --ignore-errors mismatch -o coverage.info

      - name: Print coverage summary
        working-directory: ${{github.workspace}}/build/unit-tests
        run: |
          {
            echo "## Unit test coverage"
            echo '```'
            lcov --summary coverage.info 2>&1 | grep -E 'lines|functions|branches'
            echo '```'
            echo "### Lowest-covered files"
            echo '| File | Lines |'
            echo '|---|---|'
            lcov --list coverage.info 2>/dev/null \
              | awk -F'|' '/%/ {gsub(/ /,"",$2); print $1"|"$2}' \
              | sort -t'|' -k2 -n | head -15 \
              | awk -F'|' '{printf "| %s | %s |\n", $1, $2}'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "${GITHUB_STEP_SUMMARY}"

      - name: Generate HTML report
        working-directory: ${{github.workspace}}/build/unit-tests
        run: genhtml -o lcovHtml -s --legend --branch-coverage coverage.info

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage-html
          path: ${{github.workspace}}/build/unit-tests/lcovHtml/
