---
name: ivi-homescreen

on:
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
  release:
    types: [ published, created, edited ]
  workflow_dispatch:
  schedule:
    # daily
    - cron:  '0 0 * * *'

jobs:
  ivi-homescreen:
    name: ivi-homescreen
    if: ${{ github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' && always() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: 'true'

      - name: Install runtime packages
        run: |
          echo ${{ github.server_url }}
          # Refresh the index first: the runner image's cached apt lists can
          # reference superseded package versions (e.g. mesa security bumps),
          # which 404 on the mirror and fail a bare `apt-get install`.
          sudo apt-get update
          sudo apt-get -y install ninja-build \
          libwayland-dev wayland-protocols libxkbcommon-dev libpugixml-dev \
          mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils
          cmake --version
          gcc --version

      - name: Configure Debug
        run: |
          mkdir -p ${{github.workspace}}/build/debug
          cmake -GNinja \
            -B ${{github.workspace}}/build/debug \
            -D CMAKE_BUILD_TYPE=Debug \
            -D CMAKE_STAGING_PREFIX=${{github.workspace}}/build/staging/usr/local \
            -D BUILD_NUMBER=${GITHUB_RUN_ID} \
            -D CMAKE_VERBOSE_MAKEFILE=ON

      - name: Build Debug Package
        working-directory: ${{github.workspace}}/build/debug
        run: |
          rm -rf _packages || true
          ninja -C . package
          ls -la _packages

      - name: Publish Debug Artifact TGZ
        uses: actions/upload-artifact@v7
        with:
          name: homescreen-dbg.Linux.tar.gz.zip
          path: |
            build/debug/_packages/homescreen-dbg-*-Linux.tar.gz

      - name: Publish Debug Artifact Debian
        uses: actions/upload-artifact@v7
        with:
          name: homescreen-dbg.amd64.deb.zip
          path: |
            build/debug/_packages/homescreen-dbg*_amd64.*deb

      - name: Publish Debug Artifact RPM
        uses: actions/upload-artifact@v7
        with:
          name: homescreen-dbg.x86_64.rpm.zip
          path: |
            build/debug/_packages/homescreen-dbg-*.x86_64.rpm

      - name: Configure Release
        run: |
          mkdir -p ${{github.workspace}}/build/release
          cmake -GNinja \
            -B ${{github.workspace}}/build/release \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_STAGING_PREFIX=${{github.workspace}}/build/staging/usr/local \
            -D BUILD_NUMBER=${GITHUB_RUN_ID} \
            -D CMAKE_VERBOSE_MAKEFILE=ON

      - name: Build Release Package
        working-directory: ${{github.workspace}}/build/release
        run: |
          rm -rf _packages || true
          ninja -C . package
          ls -la _packages
          echo "Release Info"
          ls -la shell/homescreen
          echo "Strip executable"
          strip shell/homescreen
          ls -la shell/homescreen
          echo "List Dependencies"
          ldd shell/homescreen

      - name: Publish Release Artifact TGZ
        uses: actions/upload-artifact@v7
        with:
          name: homescreen-Linux.tar.gz.zip
          path: |
            build/release/_packages/homescreen-*-Linux.tar.gz

      - name: Publish Release Artifact Debian
        uses: actions/upload-artifact@v7
        with:
          name: homescreen-amd64.deb.zip
          path: |
            build/release/_packages/homescreen_*_amd64.deb

      - name: Publish Release Artifact RPM
        uses: actions/upload-artifact@v7
        with:
          name: homescreen-x86_64.rpm.zip
          path: |
            build/release/_packages/homescreen-*.x86_64.rpm

  # The accessibility semantics tree is off by default (BUILD_ACCESSIBILITY).
  # Compile it here so the opt-in path -- the AccessibilityTree subsystem and
  # its engine/view wiring -- does not bit-rot. No extra dependencies, so this
  # reuses the lightweight ninja build rather than the workspace action.
  accessibility:
    name: accessibility (BUILD_ACCESSIBILITY=ON)
    if: ${{ github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' && always() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: 'true'

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build \
          libwayland-dev wayland-protocols libxkbcommon-dev libpugixml-dev \
          mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils

      - name: Configure (accessibility enabled)
        run: |
          cmake -GNinja \
            -B ${{github.workspace}}/build/accessibility \
            -D CMAKE_BUILD_TYPE=Debug \
            -D BUILD_ACCESSIBILITY=ON \
            -D CMAKE_STAGING_PREFIX=${{github.workspace}}/build/staging/usr/local \
            -D BUILD_NUMBER=${GITHUB_RUN_ID}

      - name: Build
        working-directory: ${{github.workspace}}/build/accessibility
        run: ninja -C . homescreen

  # Path-gate the (expensive) crash-handler build: it is a full
  # BUILD_CRASH_HANDLER=ON compile, so it only needs to run when build inputs
  # change. Docs/asset-only PRs skip it. Non-PR events (schedule / release /
  # workflow_dispatch) always run it.
  changes:
    if: ${{ github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      crash_handler: ${{ steps.filter.outputs.crash_handler }}
      watchdog: ${{ steps.filter.outputs.watchdog }}
    steps:
      - name: Detect feature-relevant changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Non-PR event (${{ github.event_name }}) — running crash-handler."
            echo "crash_handler=true" >> "$GITHUB_OUTPUT"
            echo "watchdog=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')
          echo "Changed files:"; echo "$files"
          if echo "$files" | grep -qE '(^cmake/|\.cmake$|CMakeLists\.txt$|^shell/|^plugins/|^third_party/|^\.github/workflows/oss-ivi-homescreen\.yml$)'; then
            echo "crash_handler=true" >> "$GITHUB_OUTPUT"
            echo "watchdog=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs/assets changed — skipping crash-handler."
            echo "crash_handler=false" >> "$GITHUB_OUTPUT"
            echo "watchdog=false" >> "$GITHUB_OUTPUT"
          fi

  crash-handler:
    needs: changes
    if: ${{ github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' && needs.changes.outputs.crash_handler == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      # Build the PR's own source with the crash handler enabled, via emb's
      # native `local` build (no --target). emb pulls the sentry-native augment
      # into a per-workspace overlay and wires it onto the embedder configure,
      # so this needs no setup-workspace / pinned checkout — it compiles exactly
      # the code under review.
      - name: Checkout ivi-homescreen (PR)
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git python3 \
            curl ca-certificates xz-utils \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgles2-mesa-dev mesa-common-dev \
            libdrm-dev libgbm-dev libinput-dev libudev-dev libseat-dev \
            libpugixml-dev libcurl4-openssl-dev
      - name: Fetch emb
        run: git clone --depth 1 https://github.com/toyota-connected/emb_cli.git emb_cli
      - name: Build crash handler (emb local, software backend)
        run: |
          eval "$(./emb_cli/bootstrap.sh --shellenv)"
          emb --version
          emb -v cross . --backend software \
            -D BUILD_CRASH_HANDLER=ON --build

  # Aggregate gate so crash-handler can be a required status check even though
  # it is path-gated (skipped on docs/asset-only PRs). This job always runs and
  # passes when crash-handler succeeded OR was skipped, and fails only when
  # crash-handler actually failed/was cancelled. Branch protection requires
  # THIS context instead of crash-handler so a legitimate skip never blocks a
  # PR while a real failure still does.
  crash-handler-gate:
    needs: crash-handler
    if: ${{ always() && github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Require crash-handler to pass or be skipped
        shell: bash
        run: |
          result="${{ needs.crash-handler.result }}"
          echo "crash-handler result: ${result}"
          if [ "${result}" = "success" ] || [ "${result}" = "skipped" ]; then
            exit 0
          fi
          echo "::error::crash-handler did not pass (result=${result})"
          exit 1

  watchdog:
    needs: changes
    if: ${{ github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' && needs.changes.outputs.watchdog == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ivi-homescreen (PR)
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git python3 \
            curl ca-certificates xz-utils \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgles2-mesa-dev mesa-common-dev \
            libdrm-dev libgbm-dev libinput-dev libudev-dev libseat-dev \
            libpugixml-dev libcurl4-openssl-dev
      - name: Fetch emb
        run: git clone --depth 1 https://github.com/toyota-connected/emb_cli.git emb_cli
      - name: Build watchdog
        run: |
          eval "$(./emb_cli/bootstrap.sh --shellenv)"
          emb --version
          emb -v cross . --backend software \
            -D BUILD_WATCHDOG=ON \
            --build
      - name: Build SystemD watchdog
        run: |
          sudo apt install -y libsystemd-dev
          eval "$(./emb_cli/bootstrap.sh --shellenv)"
          emb --version
          emb -v cross . --backend software \
            -D BUILD_WATCHDOG=ON \
            -D BUILD_SYSTEMD_WATCHDOG=ON \
            --build

  # Unit-test + coverage job.
  #
  # Builds the full unit-test suite with -DCOVERAGE=ON (--coverage on every
  # object), runs all *_test_driver binaries via CTest, captures per-file
  # line/branch/function data with lcov, filters out third-party and test
  # sources, generates an HTML report, prints the coverage percentages to the
  # job log, and uploads the HTML as a downloadable artifact.
  unit-tests:
    if: ${{ github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' && always() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: 'true'

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build lcov \
            libwayland-dev wayland-protocols libxkbcommon-dev libpugixml-dev \
            mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev

      - name: Configure (coverage)
        run: |
          cmake -GNinja \
            -B ${{github.workspace}}/build/unit-tests \
            -D CMAKE_BUILD_TYPE=Debug \
            -D BUILD_UNIT_TESTS=ON \
            -D COVERAGE=ON \
            -D CMAKE_STAGING_PREFIX=${{github.workspace}}/build/staging/usr/local \
            -D BUILD_NUMBER=${GITHUB_RUN_ID}

      - name: Build
        working-directory: ${{github.workspace}}/build/unit-tests
        run: ninja -C .

      - name: Run unit tests (CTest)
        working-directory: ${{github.workspace}}/build/unit-tests
        run: ctest --output-on-failure --test-dir .

      - name: Reset coverage counters
        working-directory: ${{github.workspace}}/build/unit-tests
        run: lcov -d . -z

      - name: Run test drivers (coverage collection)
        working-directory: ${{github.workspace}}/build/unit-tests
        run: |
          for driver in $(find test/unit_test/ -name '*_test_driver'); do
            ./${driver}
          done

      - name: Capture coverage data
        working-directory: ${{github.workspace}}/build/unit-tests
        run: |
          lcov -d . -c --rc lcov_branch_coverage=1 -o coverage.info
          lcov -r coverage.info \
            '*/test/*' '*/usr/*' '*/third_party/*' \
            --rc lcov_branch_coverage=1 -o coverage.info

      - name: Print coverage summary
        working-directory: ${{github.workspace}}/build/unit-tests
        run: |
          echo "=== Coverage Summary ==="
          lcov --summary coverage.info 2>&1 | grep -E 'lines\.|functions\.|branches\.'

      - name: Generate HTML report
        working-directory: ${{github.workspace}}/build/unit-tests
        run: genhtml -o lcovHtml -s --legend --branch-coverage coverage.info

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage-html
          path: ${{github.workspace}}/build/unit-tests/lcovHtml/
