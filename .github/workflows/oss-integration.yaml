---
name: integration-test
description: Run integration test for ivi-homescreen

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  # Runs integration test for the CrashHandler (Sentry integration)
  # - Sets up a local Kent (fake Sentry) server
  # - Builds a homescreen binary with the crash handler and integration test enabled
  # - Runs the binary, which intentionally crashes; checks if the crash report is received  
  crash-handler:
    if: ${{ github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' }}
    runs-on: ubuntu-22.04
    steps:
      # Build THIS PR's source (not a pinned v2.0 checkout) with the crash
      # handler via emb's native `local` build, then run the intentionally-
      # crashing binary against a minidump-aware fake Sentry. The integration
      # crash fires in main() before the engine runs, so the test needs no
      # Flutter app, no libflutter_engine.so (dlopened lazily, past the crash),
      # and no Flutter SDK -- only emb + the system build deps. emb stages the
      # sentry-native augment + crashpad_handler into a per-workspace overlay,
      # so no setup-workspace is needed.
      - name: Checkout ivi-homescreen (PR)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Update apt package index
        # cache-apt-pkgs-action resolves package versions before it runs its
        # own apt update, so it pins whatever the runner image's stale index
        # lists. When Ubuntu supersedes a revision and drops the old .deb from
        # the mirror (e.g. libinput 1.25.0-1ubuntu3.4), that pinned fetch 404s
        # and aborts the whole install. Refresh the index up front so it pins
        # the version currently on the mirror.
        run: sudo apt-get update
      - name: Install build + test deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            build-essential cmake ninja-build pkg-config git python3
            curl ca-certificates xz-utils
            libxkbcommon-dev libwayland-dev wayland-protocols
            libegl1-mesa-dev libgles2-mesa-dev mesa-common-dev
            libdrm-dev libgbm-dev libinput-dev libudev-dev libseat-dev
            libpugixml-dev libcurl4-openssl-dev

      - name: Fetch emb
        run: git clone --depth 1 https://github.com/toyota-connected/emb_cli.git emb_cli

      # The engine is a download, and this job had no cache for it, so every
      # run refetched it -- and a run where that fetch failed produced a
      # bundle with no libflutter_engine.so and a "Bundle failed" that reads
      # like a build error rather than a download that did not happen.
      #
      # Restore and save are split with the save under always(), because a
      # cache that exists to make a fetch survivable has to be written on the
      # path where the fetch went wrong; otherwise it only helps the runs that
      # did not need it.
      #
      # The same-named jobs in oss-ivi-homescreen.yml carry this too. They
      # share names but not definitions, which is how this pair was missed.
      - name: Restore emb engine artifacts
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/emb/store/engine
          key: emb-engine-x86_64
          restore-keys: |
            emb-engine-x86_64-
      - name: Crash-handler integration test (emb local)
        run: |
          eval "$(./emb_cli/bootstrap.sh --shellenv)"
          emb --version
          ./scripts/crash_handler_integration.sh

  # Runs integration test for the Watchdog
  # - Builds a homescreen binary with the watchdog enabled (software backend for CI)
  # - Runs test/integration/watchdog-test
  # - Checks if exited with code 0 (PASS) or 1 (FAIL)
      - name: Save emb engine artifacts
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/emb/store/engine
          key: emb-engine-x86_64-${{ github.run_id }}

  watchdog:
    if: ${{ github.server_url == 'https://github.com' && github.ref != 'refs/heads/agl' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ivi-homescreen (PR)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Update apt package index
        # cache-apt-pkgs-action resolves package versions before it runs its
        # own apt update, so it pins whatever the runner image's stale index
        # lists. When Ubuntu supersedes a revision and drops the old .deb from
        # the mirror (e.g. libinput 1.25.0-1ubuntu3.4), that pinned fetch 404s
        # and aborts the whole install. Refresh the index up front so it pins
        # the version currently on the mirror.
        run: sudo apt-get update
      - name: Install build + test deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            build-essential cmake ninja-build pkg-config git python3
            curl ca-certificates unzip xz-utils
            libxkbcommon-dev libwayland-dev wayland-protocols
            libegl1-mesa-dev libgles2-mesa-dev mesa-common-dev
            libdrm-dev libgbm-dev libinput-dev libudev-dev libseat-dev
            libpugixml-dev libcurl4-openssl-dev

      - name: Fetch emb
        run: git clone --depth 1 https://github.com/toyota-connected/emb_cli.git emb_cli

      # The engine is a download, and this job had no cache for it, so every
      # run refetched it -- and a run where that fetch failed produced a
      # bundle with no libflutter_engine.so and a "Bundle failed" that reads
      # like a build error rather than a download that did not happen.
      #
      # Restore and save are split with the save under always(), because a
      # cache that exists to make a fetch survivable has to be written on the
      # path where the fetch went wrong; otherwise it only helps the runs that
      # did not need it.
      #
      # The same-named jobs in oss-ivi-homescreen.yml carry this too. They
      # share names but not definitions, which is how this pair was missed.
      - name: Restore emb engine artifacts
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/emb/store/engine
          key: emb-engine-x86_64
          restore-keys: |
            emb-engine-x86_64-
      - name: Watchdog integration test (emb local)
        run: |
          eval "$(./emb_cli/bootstrap.sh --shellenv)"
          emb --version
          emb flutter --flutter-version $(cat .flutter-version)
          source ./setup_env.sh
          eval "$(./emb_cli/bootstrap.sh --shellenv)"
          ./scripts/watchdog_integration.sh

      - name: Install build deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            libsystemd-dev

      - name: Run integration test for systemd watchdog
        shell: bash
        run: |
          ./scripts/systemd_watchdog_integration.sh

      - name: Save emb engine artifacts
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/emb/store/engine
          key: emb-engine-x86_64-${{ github.run_id }}
