---
name: drm-kms

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [v3.0]
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
            extra_pkgs: g++-14
          - compiler: clang
            cc: clang-19
            cxx: clang++-19
            extra_pkgs: clang-19 llvm-19 lld-19 libc++-19-dev libc++abi-19-dev

    name: drm-${{ matrix.compiler }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Update apt package index
        # cache-apt-pkgs-action resolves package versions before it runs its
        # own apt update, so it pins whatever the runner image's stale index
        # lists. When Ubuntu supersedes a revision and drops the old .deb from
        # the mirror (e.g. libinput 1.25.0-1ubuntu3.4), that pinned fetch 404s
        # and aborts the whole install. Refresh the index up front so it pins
        # the version currently on the mirror.
        run: sudo apt-get update

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            ninja-build
            libwayland-dev wayland-protocols libxkbcommon-dev
            mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils
            libdrm-dev libgbm-dev libinput-dev libudev-dev libseat-dev
            libxcursor-dev
            libglib2.0-dev
            ${{ matrix.extra_pkgs }}
          version: 1.0

      - name: Setup libdisplay-info (system or from-source)
        uses: ./.github/actions/setup-libdisplay-info

      - name: Configure (DRM/KMS EGL + compositor)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -GNinja \
            -B ${{github.workspace}}/build \
            -D CMAKE_BUILD_TYPE=Debug \
            -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D BUILD_BACKEND_DRM_KMS_EGL=ON \
            -D BUILD_BACKEND_WAYLAND_EGL=OFF \
            -D BUILD_BACKEND_WAYLAND_VULKAN=OFF \
            -D BUILD_COMPOSITOR=ON \
            -D BUILD_NUMBER=${GITHUB_RUN_ID}

      - name: Build
        run: ninja -C ${{github.workspace}}/build

      - name: Verify binary is DRM-enabled
        run: |
          strings ${{github.workspace}}/build/shell/homescreen \
            | grep -q '\[DrmBackend\]'

  vkms-smoke:
    if: ${{ github.server_url == 'https://github.com' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Update apt package index
        # cache-apt-pkgs-action resolves package versions before it runs its
        # own apt update, so it pins whatever the runner image's stale index
        # lists. When Ubuntu supersedes a revision and drops the old .deb from
        # the mirror (e.g. libinput 1.25.0-1ubuntu3.4), that pinned fetch 404s
        # and aborts the whole install. Refresh the index up front so it pins
        # the version currently on the mirror.
        run: sudo apt-get update

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            ninja-build
            libwayland-dev wayland-protocols libxkbcommon-dev
            mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils
            libdrm-dev libgbm-dev libinput-dev libudev-dev libseat-dev
            libxcursor-dev
            libglib2.0-dev
            clang-19 llvm-19 lld-19 libc++-19-dev libc++abi-19-dev
          version: 1.0

      - name: Setup libdisplay-info (system or from-source)
        uses: ./.github/actions/setup-libdisplay-info

      - name: Build (clang, DRM + software + compositor)
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          # The census and input harness exercise both the DRM-KMS-EGL and the
          # software (drm-dumb sink) backends, so build both here.
          cmake -GNinja \
            -B ${{github.workspace}}/build \
            -D CMAKE_BUILD_TYPE=Debug \
            -D BUILD_BACKEND_DRM_KMS_EGL=ON \
            -D BUILD_BACKEND_SOFTWARE=ON \
            -D BUILD_SOFTWARE_SINK_DRM=ON \
            -D BUILD_BACKEND_WAYLAND_EGL=OFF \
            -D BUILD_BACKEND_WAYLAND_VULKAN=OFF \
            -D BUILD_COMPOSITOR=ON \
            -D BUILD_NUMBER=${GITHUB_RUN_ID}
          ninja -C ${{github.workspace}}/build

      - name: Load vkms
        id: vkms
        run: |
          # The Azure CI kernel often strips vkms. Try loading it; if
          # unavailable, install linux-modules-extra as a fallback.
          if ! sudo modprobe vkms 2>/dev/null; then
            echo "vkms not in $(uname -r); trying linux-modules-extra"
            sudo apt-get -y install "linux-modules-extra-$(uname -r)" || true
            sudo modprobe vkms 2>/dev/null || true
          fi
          if lsmod | grep -q vkms; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            ls /sys/class/drm/card*-Virtual-* 2>/dev/null \
              || (echo "vkms loaded but no Virtual connector" && exit 1)
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::vkms module unavailable on $(uname -r); skipping smoke test"
          fi

      - name: Harness pre-flight (--check)
        if: steps.vkms.outputs.available == 'true'
        run: |
          test/drm_kms_vkms.sh --check

      - name: Load uinput module (input-injection gate)
        if: steps.vkms.outputs.available == 'true'
        run: |
          # Best-effort: load uinput so the input harness's injection scenarios
          # (I1/I6) can run where the runner can open /dev/uinput. It stays
          # root-only on a hosted runner, so those scenarios SKIP (reported in
          # the summary) rather than fail; a self-hosted runner that grants
          # write access runs them for real.
          sudo modprobe uinput 2>/dev/null \
            || echo "::warning::uinput unavailable; input injection scenarios will skip"

      - name: Fetch emb
        if: steps.vkms.outputs.available == 'true'
        run: git clone --depth 1 https://github.com/toyota-connected/emb_cli.git emb_cli

      # The engine is a download and this job had no cache for it, so every
      # run refetched it -- and a run whose fetch failed produced a bundle
      # with no libflutter_engine.so, reported as "Bundle failed", which reads
      # like a build error rather than a download that never happened.
      #
      # Restore and save are split with the save under always(), because a
      # cache meant to make a fetch survivable has to be written on the path
      # where the fetch went wrong; otherwise it only helps runs that did not
      # need it. Same treatment as the crash-handler and watchdog jobs.
      - name: Restore emb engine artifacts
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/emb/store/engine
          key: emb-engine-x86_64
          restore-keys: |
            emb-engine-x86_64-
      - name: Harness integration (census + input harness on vkms)
        if: steps.vkms.outputs.available == 'true'
        env:
          IVI_BUILD: ${{github.workspace}}/build
        run: |
          eval "$(./emb_cli/bootstrap.sh --shellenv)"
          emb --version
          emb flutter --flutter-version "$(cat .flutter-version)"
          source ./setup_env.sh
          eval "$(./emb_cli/bootstrap.sh --shellenv)"
          ./scripts/vkms_harness_integration.sh

      # Only save a cache that has something in it. The save runs on failure
      # on purpose -- a run whose fetch died partway should still leave the
      # next one better off -- but a run that fetched *nothing* would
      # otherwise store an empty directory, and since the restore takes the
      # newest prefix match that empty entry becomes what every later run
      # restores. A cache added to break a deadlock would then cause one.
      - name: Check the engine artifacts landed
        if: always()
        id: engine_present
        run: |
          if find ~/.cache/emb/store/engine -name 'libflutter_engine.so' \
               -print -quit 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no engine artifacts to cache"
          fi

      - name: Save emb engine artifacts
        if: always() && steps.engine_present.outputs.present == 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/emb/store/engine
          key: emb-engine-x86_64-${{ github.run_id }}
