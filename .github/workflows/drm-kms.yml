---
name: drm-kms

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [v3.0]
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
            extra_pkgs: g++-14
          - compiler: clang
            cc: clang-19
            cxx: clang++-19
            extra_pkgs: clang-19 llvm-19 lld-19 libc++-19-dev libc++abi-19-dev

    name: drm-${{ matrix.compiler }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        uses: ./.github/actions/apt-packages
        with:
          packages: >-
            ninja-build
            libwayland-dev wayland-protocols libxkbcommon-dev
            mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils
            libdrm-dev libgbm-dev libinput-dev libudev-dev libseat-dev
            libxcursor-dev
            libglib2.0-dev
            ${{ matrix.extra_pkgs }}

      - name: Setup libdisplay-info (system or from-source)
        uses: ./.github/actions/setup-libdisplay-info

      - name: Configure (DRM/KMS EGL + compositor)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -GNinja \
            -B ${{github.workspace}}/build \
            -D CMAKE_BUILD_TYPE=Debug \
            -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D BUILD_BACKEND_DRM_KMS_EGL=ON \
            -D BUILD_BACKEND_WAYLAND_EGL=OFF \
            -D BUILD_BACKEND_WAYLAND_VULKAN=OFF \
            -D BUILD_COMPOSITOR=ON \
            -D BUILD_NUMBER=${GITHUB_RUN_ID}

      - name: Build
        run: ninja -C ${{github.workspace}}/build

      - name: Verify binary is DRM-enabled
        run: |
          strings ${{github.workspace}}/build/shell/homescreen \
            | grep -q '\[DrmBackend\]'

  vkms-smoke:
    if: ${{ github.server_url == 'https://github.com' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        uses: ./.github/actions/apt-packages
        with:
          packages: >-
            ninja-build
            libwayland-dev wayland-protocols libxkbcommon-dev
            mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils
            libdrm-dev libgbm-dev libinput-dev libudev-dev libseat-dev
            libxcursor-dev
            libglib2.0-dev
            clang-19 llvm-19 lld-19 libc++-19-dev libc++abi-19-dev

      - name: Setup libdisplay-info (system or from-source)
        uses: ./.github/actions/setup-libdisplay-info

      - name: Build (clang, DRM + software + compositor)
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          # The census and input harness exercise both the DRM-KMS-EGL and the
          # software (drm-dumb sink) backends, so build both here.
          #
          # ENABLE_OSGI because the OSGi multi-bundle harness is already wired
          # into vkms_harness_integration.sh and was skipping itself: without
          # the option the binary carries no [osgi] strings, which the harness
          # reads as "not an OSGi build" and honestly reports as a skip. This is
          # the flip that comment anticipated.
          cmake -GNinja \
            -B ${{github.workspace}}/build \
            -D CMAKE_BUILD_TYPE=Debug \
            -D BUILD_BACKEND_DRM_KMS_EGL=ON \
            -D BUILD_BACKEND_SOFTWARE=ON \
            -D BUILD_SOFTWARE_SINK_DRM=ON \
            -D BUILD_BACKEND_WAYLAND_EGL=OFF \
            -D BUILD_BACKEND_WAYLAND_VULKAN=OFF \
            -D BUILD_COMPOSITOR=ON \
            -D ENABLE_OSGI=ON \
            -D BUILD_NUMBER=${GITHUB_RUN_ID}
          ninja -C ${{github.workspace}}/build

      - name: Load vkms
        id: vkms
        run: |
          # The Azure CI kernel often strips vkms. Try loading it; if
          # unavailable, install linux-modules-extra as a fallback.
          if ! sudo modprobe vkms 2>/dev/null; then
            echo "vkms not in $(uname -r); trying linux-modules-extra"
            sudo apt-get -y install "linux-modules-extra-$(uname -r)" || true
            sudo modprobe vkms 2>/dev/null || true
          fi
          if lsmod | grep -q vkms; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            ls /sys/class/drm/card*-Virtual-* 2>/dev/null \
              || (echo "vkms loaded but no Virtual connector" && exit 1)
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::vkms module unavailable on $(uname -r); skipping smoke test"
          fi

      # A bare modprobe gives one card with one connected connector, and the
      # OSGi multi-bundle harness needs two on the same card -- it pins a
      # bundle to each. It resolves the card with ihs_find_vkms_card 2, found
      # nothing, and skipped both transport legs while the job stayed green.
      # The census and input harnesses ask for one connector, which is why they
      # ran on card0 in the same step and this one did not.
      #
      # vkms_dual.sh provisions a second instance through the >= 6.11 configfs
      # interface, so it adds a card rather than reloading the module: card0
      # and everything already using it are untouched. Best-effort, because a
      # kernel without the configfs interface should leave this job exactly as
      # it was rather than failing.
      - name: Provision a dual-connector vkms instance
        id: vkms_dual
        if: steps.vkms.outputs.available == 'true'
        run: |
          # The subsystem directory appears on its own once the module is
          # loaded and configfs is mounted -- nothing creates it -- so the
          # single precondition is that mount. The first attempt died on
          # "/sys/kernel/config/vkms missing after modprobe" against a 6.17
          # kernel, well past the >= 6.11 floor the script names, so the other
          # half of that message is the live one. The lines below say which:
          # an unmounted configfs is this step's to fix, whereas a mounted one
          # with no vkms subsystem means the interface is not in this build and
          # no amount of retrying here will conjure it.
          sudo modprobe configfs 2>/dev/null || true
          grep -q ' /sys/kernel/config ' /proc/mounts \
            || sudo mount -t configfs none /sys/kernel/config 2>/dev/null || true
          echo "kernel: $(uname -r)"
          grep ' /sys/kernel/config ' /proc/mounts || echo "  configfs NOT mounted"
          echo "/sys/kernel/config:"
          ls /sys/kernel/config 2>&1 | sed 's/^/  /'
          if sudo third_party/drm-cxx/scripts/vkms_dual.sh up; then
            # The node arrives root:video 0660 and the harness runs as the
            # unprivileged runner user, so without this it would fail to open a
            # card that is finally there -- worse than the skip it replaces.
            sudo chmod a+rw /dev/dri/card* 2>/dev/null || true
            sudo third_party/drm-cxx/scripts/vkms_dual.sh status || true
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
          else
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            echo "::warning::vkms_dual.sh could not provision two connectors; the OSGi multi-bundle harness will skip"
          fi
          echo "connectors by card:"
          for c in /sys/class/drm/card[0-9]*-*/status; do
            [ -e "$c" ] && echo "  $c = $(cat "$c")"
          done

      - name: Harness pre-flight (--check)
        if: steps.vkms.outputs.available == 'true'
        run: |
          test/drm_kms_vkms.sh --check

      - name: Load uinput module (input-injection gate)
        if: steps.vkms.outputs.available == 'true'
        run: |
          # Best-effort: load uinput so the input harness's injection scenarios
          # (I1/I6) can run where the runner can open /dev/uinput. It stays
          # root-only on a hosted runner, so those scenarios SKIP (reported in
          # the summary) rather than fail; a self-hosted runner that grants
          # write access runs them for real.
          sudo modprobe uinput 2>/dev/null \
            || echo "::warning::uinput unavailable; input injection scenarios will skip"

      - name: Fetch emb
        if: steps.vkms.outputs.available == 'true'
        run: git clone --depth 1 https://github.com/toyota-connected/emb_cli.git emb_cli

      # The engine is a download and this job had no cache for it, so every
      # run refetched it -- and a run whose fetch failed produced a bundle
      # with no libflutter_engine.so, reported as "Bundle failed", which reads
      # like a build error rather than a download that never happened.
      #
      # Restore and save are split with the save under always(), because a
      # cache meant to make a fetch survivable has to be written on the path
      # where the fetch went wrong; otherwise it only helps runs that did not
      # need it. Same treatment as the crash-handler and watchdog jobs.
      - name: Restore emb engine artifacts
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/emb/store/engine
          key: emb-engine-x86_64
          restore-keys: |
            emb-engine-x86_64-
      - name: Harness integration (census + input harness on vkms)
        if: steps.vkms.outputs.available == 'true'
        env:
          IVI_BUILD: ${{github.workspace}}/build
          # Only demand that the OSGi harness assert something where the card
          # it needs was actually provisioned. Where it was not, this stays 0
          # and the leg skips as before: a capability the runner never had
          # should read as a warning, the way an absent vkms or uinput does,
          # rather than as a red build.
          REQUIRE_RUN: ${{ steps.vkms_dual.outputs.provisioned == 'true' && '1' || '0' }}
        run: |
          eval "$(./emb_cli/bootstrap.sh --shellenv)"
          emb --version
          emb flutter --flutter-version "$(cat .flutter-version)"
          source ./setup_env.sh
          eval "$(./emb_cli/bootstrap.sh --shellenv)"
          ./scripts/vkms_harness_integration.sh

      # Only save a cache that has something in it. The save runs on failure
      # on purpose -- a run whose fetch died partway should still leave the
      # next one better off -- but a run that fetched *nothing* would
      # otherwise store an empty directory, and since the restore takes the
      # newest prefix match that empty entry becomes what every later run
      # restores. A cache added to break a deadlock would then cause one.
      - name: Check the engine artifacts landed
        if: always()
        id: engine_present
        run: |
          if find ~/.cache/emb/store/engine -name 'libflutter_engine.so' \
               -print -quit 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no engine artifacts to cache"
          fi

      - name: Save emb engine artifacts
        if: always() && steps.engine_present.outputs.present == 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/emb/store/engine
          key: emb-engine-x86_64-${{ github.run_id }}
