---
# Cross-compiled PiOS (aarch64) artifacts via emb + a prebuilt toolchain image.
#
# Two phases:
#   publish-<os>  (per PiOS variant) — emb resolves the toolchain + sysroot and
#                 publishes a content-addressed OCI image to GHCR. The emb cross
#                 sandbox is cached, and `emb cross --publish` skips the build
#                 when the image (keyed by the manifest's sysroot_key) already
#                 exists, so this is a near-no-op once warm.
#   build-...     (per board x os x backend) — runs INSIDE the published image,
#                 where `emb cross --build -w /emb` is a pure cache hit on the
#                 baked toolchain + sysroot. No per-run toolchain/sysroot fetch.
#
# Runs on x86_64 runners: the pinned ARM toolchains cross-compile aarch64 (no
# emulation). Hardware facts live in emb's board library; this repo's
# raspberry-pi.emb.yaml `extends` it with ivi-homescreen's backends + plugins.
name: pios

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [v3.0]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EMB_REPO: https://github.com/toyota-connected/emb_cli.git
  IMAGE: ghcr.io/${{ github.repository_owner }}/emb-cross-aarch64-none-linux-gnu
  # emb cross workspace (-w) for the publish phase. The heavy artifacts live in
  # the content-addressed store (cached separately), not here.
  EMB_WS: ${{ github.workspace }}/.emb-ws
  # Content-addressed store cache (oras/OCI): the publish phase pushes the
  # resolved sysroot base + toolchain here, and the build phase pulls them so
  # it resolves as a cache hit instead of re-downloading + re-extracting. Repo
  # defaults to `emb-cache`, so entries land at <registry>/emb-cache:<tag>.
  EMB_CACHE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  # oras (OCI client) pinned version. Cached per job keyed on this value, so the
  # binary is fetched from GitHub releases only when the version changes — every
  # matrix job re-downloading it otherwise gets rate-limited.
  ORAS_VERSION: "1.2.0"

jobs:
  publish:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        pios: [bookworm, trixie]
    name: publish-${{ matrix.pios }}
    steps:
      - name: Checkout ivi-homescreen
        uses: actions/checkout@v7
        with:
          path: ivi-homescreen
          submodules: recursive

      - name: Update apt package index
        # cache-apt-pkgs-action resolves package versions before it runs its
        # own apt update, so it pins whatever the runner image's stale index
        # lists. When Ubuntu supersedes a revision and drops the old .deb from
        # the mirror (e.g. libinput 1.25.0-1ubuntu3.4), that pinned fetch 404s
        # and aborts the whole install. Refresh the index up front so it pins
        # the version currently on the mirror.
        run: sudo apt-get update
      - name: Install build deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            tar xz-utils rsync curl ca-certificates

      - name: Fetch emb
        run: git clone --depth 1 "$EMB_REPO" emb_cli

      # Cache emb's content-addressed store, not the -w workspace: the workspace
      # only holds symlinks into the store, so caching it restored dangling
      # links and re-resolved. Caching store/ (the extracted sysroot base +
      # toolchain trees, keyed by the sysroot inputs) makes the resolve a hit.
      # store/ only — not all of ~/.cache/emb — to skip the multi-GB image/CAS
      # downloads and stay under the repo cache limit.
      - name: Cache emb store (extracted sysroot + toolchain)
        uses: actions/cache@v6
        with:
          path: ~/.cache/emb/store
          key: emb-store-${{ matrix.pios }}-${{ hashFiles('ivi-homescreen/.emb/base.emb.yaml', 'ivi-homescreen/.emb/raspberry-pi.emb.yaml', 'emb_cli/boards/raspberry-pi.emb.yaml') }}
          restore-keys: |
            emb-store-${{ matrix.pios }}-

      # Retried: ghcr.io intermittently answers a valid credential with
      # "denied", and a bare login turns that into a red build that never
      # compiled anything. POSIX sh so the same idiom works here (bash) and in
      # the container job below (dash). The token is re-fed on every attempt --
      # --password-stdin consumes it, so the pipeline must live inside the loop.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          i=1
          while :; do
            if printf '%s' "$GHCR_TOKEN" \
                 | docker login ghcr.io -u "$GHCR_USER" --password-stdin; then
              break
            fi
            if [ "$i" -ge 5 ]; then
              echo "::error::docker login ghcr.io failed after $i attempts"
              exit 1
            fi
            # Surfaced, not swallowed: a rising retry count is the early signal
            # that the registry is degrading rather than blipping.
            echo "::warning::docker login ghcr.io failed (attempt $i/5); retrying"
            sleep $(( i * 3 ))
            i=$(( i + 1 ))
          done

      # oras uploads the resolved store entries to the OCI cache in the publish
      # step below (EMB_CACHE_REGISTRY). Cache the binary keyed on the version so
      # a warm run skips the GitHub-releases fetch — the publish job had no cache
      # and a run hit a 504 window that outlasted the curl retries and failed.
      #
      # Cache a runner-owned dir, NOT /usr/local/bin: this job runs on the bare
      # runner as a non-root user, and actions/cache runs without sudo, so it
      # cannot restore into root-owned /usr/local/bin. Install from the cached
      # dir into /usr/local/bin (where the publish step's oras is on PATH).
      - name: Cache oras binary
        uses: actions/cache@v6
        with:
          path: ~/oras-bin
          # The location is part of the key. The build job caches oras at a
          # different path under what was the same key, and a cache entry
          # restores to the path it was saved from -- so whichever job saved
          # first owned the entry and the other got a "hit" that put the
          # binary somewhere it does not look, then downloaded it again on
          # every run.
          key: oras-${{ env.ORAS_VERSION }}-linux-amd64-home
      - name: Install + log in oras
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # Fetch from GitHub releases only on a cache miss (version bump or
          # eviction); the cache restores ~/oras-bin/oras otherwise.
          if [ ! -x "$HOME/oras-bin/oras" ]; then
            mkdir -p "$HOME/oras-bin"
            # To a file, not a pipe: see the build job's copy -- a curl retry
            # restarts the stream and a pipe hands tar the truncated attempt
            # followed by a whole one.
            curl -fsSL --retry 8 --retry-all-errors --retry-max-time 300 \
              --connect-timeout 15 -o /tmp/oras.tar.gz \
              "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
            tar -xzf /tmp/oras.tar.gz -C "$HOME/oras-bin" oras
            rm -f /tmp/oras.tar.gz
          fi
          sudo install -m 0755 "$HOME/oras-bin/oras" /usr/local/bin/oras
          # Retried for the same reason as the docker login above: the download
          # was already hardened, the authentication never was.
          i=1
          while :; do
            if printf '%s' "$GHCR_TOKEN" \
                 | oras login ghcr.io -u "$GHCR_USER" --password-stdin; then
              break
            fi
            if [ "$i" -ge 5 ]; then
              echo "::error::oras login ghcr.io failed after $i attempts"
              exit 1
            fi
            echo "::warning::oras login ghcr.io failed (attempt $i/5); retrying"
            sleep $(( i * 3 ))
            i=$(( i + 1 ))
          done

      # rpi5-<os> is the canonical publish target: the sysroot (and thus the
      # image) is model-independent, so one image per OS serves rpi4/zero-2w
      # too. --tag <os> is the stable alias the build matrix consumes; the
      # immutable sysroot_key tag is always pushed + skip-checked.
      - name: Publish toolchain image (${{ matrix.pios }})
        working-directory: ivi-homescreen
        run: |
          eval "$(../emb_cli/bootstrap.sh --shellenv)"
          emb --version
          emb cross . \
            --target "rpi5-${{ matrix.pios }}" \
            --publish --image "$IMAGE" --tag "${{ matrix.pios }}" \
            -w "$EMB_WS"

  build:
    needs: publish
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/emb-cross-aarch64-none-linux-gnu:${{ matrix.pios }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        pios: [bookworm, trixie]
        board: [rpi5, rpi4, rpi-zero-2w]
        backend: [wayland-egl, wayland-vulkan, drm-kms-egl, drm-kms-vulkan, software]
        # drm-kms-vulkan is rpi5-only.
        exclude:
          - { board: rpi4, backend: drm-kms-vulkan }
          - { board: rpi-zero-2w, backend: drm-kms-vulkan }
    name: build-${{ matrix.board }}-${{ matrix.pios }}-${{ matrix.backend }}
    steps:
      - name: Checkout ivi-homescreen
        uses: actions/checkout@v7
        with:
          path: ivi-homescreen
          submodules: recursive

      - name: Checkout ivi-homescreen-plugins (sibling)
        uses: actions/checkout@v7
        with:
          repository: toyota-connected/ivi-homescreen-plugins
          path: ivi-homescreen-plugins
          submodules: recursive

      - name: Fetch emb
        run: git clone --depth 1 "$EMB_REPO" emb_cli

      # The sysroot base + toolchain are pulled from the OCI cache below, so the
      # build normally does no extraction. These tools are the miss fallback:
      # emb_cli extracts a sysroot rootlessly when sfdisk (fdisk) and debugfs
      # (e2fsprogs) are present; without them it falls back to `sudo losetup`,
      # which a non-privileged container can't run (no loop devices). Keep the
      # fallback rootless so a cache miss re-extracts instead of dying.
      - name: Ensure rootless sysroot-extract tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fdisk e2fsprogs

      # oras pulls the resolved store entries (sysroot base + toolchain) from the
      # OCI cache in the Build step (EMB_CACHE_REGISTRY), so the resolve is a
      # cache hit. Root in-container; the image ships curl.
      - name: Cache oras binary
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/oras
          # Distinct from the publish job's entry; see the note there.
          key: oras-${{ env.ORAS_VERSION }}-linux-amd64-usrlocal
      - name: Install + log in oras
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # Only fetch from GitHub releases on a cache miss (version bump or
          # a key change); the cache restores /usr/local/bin/oras otherwise.
          #
          # A miss here is a miss in every matrix leg at once -- around 25 jobs
          # asking GitHub for the same file in the same second, which is the
          # concentration that provokes the failure rather than a symptom of
          # it. So the fetch is staggered by a short per-job delay before it
          # starts, and retried far more patiently than a warm path would
          # need: the point is to outlast a bad window, not to fail fast.
          #
          # No --retry-delay: curl backs off exponentially without it, which
          # spreads the retries too. PID-derived jitter because the container
          # shell is dash and has no $RANDOM.
          #
          # Downloaded to a file rather than piped into tar: on a retry curl
          # restarts the transfer from the beginning, so a pipe hands tar the
          # truncated first attempt followed by a second full stream. That is
          # why a flaky fetch here surfaced as "tar: exit 2" rather than a
          # curl error -- the retries were making the input corrupt.
          if [ ! -x /usr/local/bin/oras ]; then
            sleep $(( $$ % 20 ))
            curl -fsSL --retry 8 --retry-all-errors --retry-max-time 300 \
              --connect-timeout 15 -o /tmp/oras.tar.gz \
              "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
            tar -xzf /tmp/oras.tar.gz -C /usr/local/bin oras
            rm -f /tmp/oras.tar.gz
          fi
          # This is the login that has actually failed in CI: ~25 matrix jobs
          # authenticate to ghcr.io at once, which is exactly the concentration
          # that provokes a spurious "denied". No shell: bash here on purpose --
          # the loop is POSIX so it runs under the container's dash unchanged.
          i=1
          while :; do
            if printf '%s' "$GHCR_TOKEN" \
                 | oras login ghcr.io -u "$GHCR_USER" --password-stdin; then
              break
            fi
            if [ "$i" -ge 5 ]; then
              echo "::error::oras login ghcr.io failed after $i attempts"
              exit 1
            fi
            echo "::warning::oras login ghcr.io failed (attempt $i/5); retrying"
            sleep $(( i * 3 ))
            i=$(( i + 1 ))
          done

      # ...and rebuilding them means fetching their sources, which is the one
      # network dependency left in this job. emb keeps the archive beside the
      # extracted tree and skips the download when it is already there, so
      # caching the archives alone turns the fetch into a no-op -- the
      # extracted trees are not cached, since they are rebuilt against this
      # image's toolchain regardless.
      #
      # This is not a hypothetical: github.com closed the connection mid-fetch
      # for wayland-cxx-scanner and failed the build, and emb's own four
      # retries had already been spent. Keyed on the augment definitions, so a
      # new or bumped source misses and refetches; every other run stays off
      # the network entirely.
      #
      # Keyed on the OS too, because bookworm and trixie do not fetch the same
      # set. bookworm cross-builds libdisplay-info 0.2.0 -- it ships 0.1.1 and
      # drm-cxx needs >= 0.2.0 -- while trixie takes libdisplay-info-dev from
      # apt and declares `augment: [*augment_scanner]` alone. Two archives
      # against one. This comment used to claim the opposite, and the claim was
      # wrong in a way the restore-keys fallback below acts on: a bookworm job
      # matching a trixie entry starts one archive short of what it needs.
      # The OS-specific prefix is tried first for that reason; the bare
      # `emb-augment-src-` below stays as a last resort, where restoring the
      # one shared archive still beats restoring nothing.
      #
      # Board and backend are genuinely uniform. Every board aliases the same
      # augment list, and the only backend-sensitive augments (sentry-native,
      # accesskit-c) sit behind BUILD_CRASH_HANDLER / BUILD_ACCESSKIT, which
      # this workflow never passes.
      #
      # The exact key is the complete set, written only by a green build. The
      # first restore-key repeats it as a prefix, which is what reaches the
      # `-partial-<run id>` entries a failed run leaves behind: preferred in
      # that order, so a partial never shadows a complete one however recently
      # it was written.
      #
      # Restore and save are separate so the save can run after a failed
      # build. actions/cache skips saving when the job fails, which for a
      # cache whose whole purpose is to stop a flaky download would be a
      # deadlock: the archives only land after a green build, and the build
      # cannot go green while the download keeps failing. Saving whatever did
      # arrive means each attempt leaves the next one better off.
      - name: Restore augment sources
        uses: actions/cache/restore@v6
        with:
          path: |
            /emb/.config/flutter_workspace/overlay-src/*.tar.gz
            /emb/.config/flutter_workspace/overlay-src/*.tar.xz
            /emb/.config/flutter_workspace/overlay-src/*.tar.bz2
            /emb/.config/flutter_workspace/overlay-src/*.tgz
            /emb/.config/flutter_workspace/overlay-src/*.zip
          key: emb-augment-src-${{ hashFiles('ivi-homescreen/.emb/base.emb.yaml', 'ivi-homescreen/.emb/raspberry-pi.emb.yaml') }}-${{ matrix.pios }}
          restore-keys: |
            emb-augment-src-${{ hashFiles('ivi-homescreen/.emb/base.emb.yaml', 'ivi-homescreen/.emb/raspberry-pi.emb.yaml') }}-${{ matrix.pios }}
            emb-augment-src-

      # The image bakes the toolchain + sysroot at /emb, so -w /emb resolves as
      # a pure cache hit (no download/extract). Host build tools (cmake, ninja,
      # meson, wayland-scanner) are baked too; only the augment libs rebuild.
      - name: Build ${{ matrix.backend }}
        # id: the save steps below key off whether this succeeded, which is
        # what tells a complete set of fetched archives from a partial one.
        id: build
        working-directory: ivi-homescreen
        # Container jobs default to dash (sh); pipefail/SECONDS need bash.
        shell: bash
        run: |
          set -o pipefail
          eval "$(../emb_cli/bootstrap.sh --shellenv)"
          emb --version
          start=$SECONDS
          # Retried only when the failure was an augment source download.
          #
          # emb retries those itself, four times with backoff, and github.com
          # has been out for longer than that window -- a 503 and a mid-header
          # disconnect have each failed this job. Retrying the whole step gives
          # the origin minutes rather than seconds, and costs nothing when it
          # succeeds because emb keeps each archive and skips what it already
          # has, so an attempt resumes rather than restarting.
          #
          # Scoped to that one message on purpose: a compile error must still
          # fail on the first attempt rather than being rebuilt three times.
          attempt=1
          while :; do
            # -v streams the toolchain/compile output line-prefixed into the
            # log (tee'd) so every build leaves a full record, not just
            # spinners.
            #
            # 2>&1 before the pipe, because the grep below reads this file and
            # emb reports a failed augment download on stderr. Without it the
            # message reached the console -- both streams land there -- but
            # never the file, so the retry decided every download failure was
            # "something other than a download" and gave up on the first
            # attempt. The retry has therefore never once fired.
            if emb -v cross . \
                 --target "${{ matrix.board }}-${{ matrix.pios }}" \
                 --build --backend "${{ matrix.backend }}" \
                 --no-verify -w /emb 2>&1 | tee /tmp/emb-build.log; then
              break
            fi
            if ! grep -q "augment: download failed" /tmp/emb-build.log; then
              echo "::error::build failed for a reason other than a source download"
              exit 1
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::augment source download still failing after $attempt attempts"
              exit 1
            fi
            # Surfaced rather than swallowed: a rising count is the signal
            # that the origin is degrading rather than blipping.
            echo "::warning::augment source download failed (attempt $attempt/3); retrying"
            sleep $(( attempt * 30 ))
            attempt=$(( attempt + 1 ))
          done
          dur=$(( SECONDS - start ))
          # Per-job timing summary: the cache-hit consume should resolve in
          # seconds (no toolchain/sysroot fetch). emb prints resolve/augment/
          # build phase times; capture them plus the wall-clock total.
          {
            echo "### ${{ matrix.board }}-${{ matrix.pios }} · ${{ matrix.backend }}"
            echo ""
            echo "- total: ${dur}s (cache-hit consume — no toolchain/sysroot fetch)"
            grep -aE "Resolved|augment +:|build +:" /tmp/emb-build.log \
              | sed -E 's/^[[:space:]]*[^A-Za-z]*/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      # Two saves, because "what a run fetched" and "everything that has to be
      # fetched" are not the same thing and must not share a key.
      #
      # The key is the manifest hash and the OS -- nothing more. Board and
      # backend do not change what gets fetched, so carrying them turned one
      # entry per OS into thirteen identical ones apiece. A run id does not
      # belong here either: it is unique per run, so it would mint two fresh
      # entries every single run and re-upload archives the cache already
      # holds, which is the churn this is meant to remove. bookworm and trixie
      # each own exactly one entry, for as long as the manifest is unchanged.
      #
      # A stable key cannot be overwritten, though -- actions/cache/save
      # refuses a key that exists -- so a partial set saved by a failed run
      # would own it until the manifest hash changed, and the flaky download
      # the cache exists to absorb would be the one thing never cached. Hence
      # the split: a green build means emb fetched everything, so that set
      # claims the stable key; anything less is kept under a run-scoped key
      # that the restore step reaches only as a fallback. Failure runs churn;
      # green runs do not.
      #
      # The thirteen jobs sharing an OS all write the same key. The first wins
      # and the rest log "unable to reserve cache", which is the expected
      # outcome rather than a failure -- they were writing identical archives,
      # and the oras cache in this workflow already behaves this way.
      - name: Save augment sources
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            /emb/.config/flutter_workspace/overlay-src/*.tar.gz
            /emb/.config/flutter_workspace/overlay-src/*.tar.xz
            /emb/.config/flutter_workspace/overlay-src/*.tar.bz2
            /emb/.config/flutter_workspace/overlay-src/*.tgz
            /emb/.config/flutter_workspace/overlay-src/*.zip
          key: emb-augment-src-${{ hashFiles('ivi-homescreen/.emb/base.emb.yaml', 'ivi-homescreen/.emb/raspberry-pi.emb.yaml') }}-${{ matrix.pios }}

      # always(): the point is to keep what a failed run managed to fetch, so
      # each attempt leaves the next one better off. Run-scoped so it never
      # claims the stable key above.
      - name: Save partial augment sources
        if: always() && steps.build.outcome != 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            /emb/.config/flutter_workspace/overlay-src/*.tar.gz
            /emb/.config/flutter_workspace/overlay-src/*.tar.xz
            /emb/.config/flutter_workspace/overlay-src/*.tar.bz2
            /emb/.config/flutter_workspace/overlay-src/*.tgz
            /emb/.config/flutter_workspace/overlay-src/*.zip
          key: emb-augment-src-${{ hashFiles('ivi-homescreen/.emb/base.emb.yaml', 'ivi-homescreen/.emb/raspberry-pi.emb.yaml') }}-${{ matrix.pios }}-partial-${{ github.run_id }}

      - name: Upload homescreen binary
        uses: actions/upload-artifact@v7
        with:
          name: homescreen-${{ matrix.board }}-${{ matrix.pios }}-${{ matrix.backend }}
          path: /emb/.config/flutter_workspace/cross-build-*/build-${{ matrix.backend }}/shell/homescreen
          if-no-files-found: error

  # Single stable status for branch protection: aggregates the publish + build
  # matrix into one `pios` check, so required-checks don't have to enumerate
  # every board×os×backend job (which would re-break on any matrix change).
  # Passes on success or skipped (e.g. the github.com guard); fails if any
  # publish/build job failed or was cancelled.
  pios:
    needs: [publish, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Gate on publish + build
        run: |
          for r in "${{ needs.publish.result }}" "${{ needs.build.result }}"; do
            case "$r" in
              failure|cancelled)
                echo "pios gate: a required job result was '$r'"; exit 1 ;;
            esac
          done
          echo "pios gate ok: publish=${{ needs.publish.result }} \
            build=${{ needs.build.result }}"
