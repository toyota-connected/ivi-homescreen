name: "CodeQL"

on:
  push:
    branches: [ 'v2.0' ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ 'main' ]
  schedule:
    - cron: '29 4 * * 4'

jobs:
  analyze:
    if: ${{ github.server_url == 'https://github.com' &&  always() }}
    name: Analyze
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install packages
      run: |
        echo ${{ github.server_url }}
        sudo apt-get update
        sudo apt-get -y install ninja-build \
        libwayland-dev wayland-protocols libxkbcommon-dev libpugixml-dev \
        mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils
        cmake --version
        gcc --version

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # security-and-quality keeps the maintainability queries on our own
        # code. third_party submodules are compiled into the build, so CodeQL
        # extracts and reports them regardless of paths-ignore (a known
        # compiled-language limitation); their alerts are dismissed as
        # "won't fix" in the security dashboard rather than filtered here.
        queries: +security-and-quality

    - name: Configure
      run: |
        mkdir -p ${{github.workspace}}/build/release
        cmake -GNinja \
          -B ${{github.workspace}}/build/release \
          -D CMAKE_BUILD_TYPE=Release \
          -D CMAKE_STAGING_PREFIX=${{github.workspace}}/build/staging/usr/local \
          -D BUILD_NUMBER=${GITHUB_RUN_ID}

    - name: Build Release Packages
      working-directory: ${{github.workspace}}/build/release
      run: |
        rm -rf _packages || true
        ninja -C . package
        ls -la _packages

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
