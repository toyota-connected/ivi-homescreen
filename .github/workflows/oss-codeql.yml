name: "CodeQL"

on:
  push:
    branches: [ 'v3.0' ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ 'main' ]
  schedule:
    - cron: '29 4 * * 4'

jobs:
  analyze:
    if: ${{ github.server_url == 'https://github.com' &&  always() }}
    name: Analyze
    # 24.04, matching drm-kms.yml. That workflow already builds this backend
    # set on this runner with these packages, so the scan config is proven rather
    # than assumed; 22.04 was fine for the wayland-only default but was never
    # exercised with libdrm/libgbm/libseat.
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install packages
      uses: ./.github/actions/apt-packages
      with:
        packages: >-
          build-essential cmake ninja-build pkg-config
          libwayland-dev wayland-protocols libxkbcommon-dev libpugixml-dev
          mesa-common-dev libegl1-mesa-dev libgles2-mesa-dev mesa-utils
          libdrm-dev libgbm-dev libinput-dev libudev-dev libseat-dev
          libxcursor-dev libglib2.0-dev

    # third_party/drm-cxx requires libdisplay-info >= 0.2.0 (its
    # CMakeLists.txt:148), and ubuntu-24.04 ships 0.1.1 -- so enabling the DRM
    # backends means this step, exactly as drm-kms.yml and lint.yml do it. It
    # uses the host library when new enough and otherwise builds the pinned tag
    # from source, exporting PKG_CONFIG_PATH for the configure below.
    - name: Setup libdisplay-info (system or from-source)
      uses: ./.github/actions/setup-libdisplay-info

    - name: Show toolchain versions
      run: |
          cmake --version
          gcc --version

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # security-and-quality keeps the maintainability queries on our own
        # code. third_party submodules are compiled into the build, so CodeQL
        # extracts and reports them regardless of paths-ignore (a known
        # compiled-language limitation); their results are dropped from the
        # SARIF before upload -- see the filter step below.
        queries: +security-and-quality

    - name: Configure
      run: |
        mkdir -p ${{github.workspace}}/build/release
        # CodeQL analyzes what the build compiles, so every option left at its
        # default in cmake/options.cmake is code it never sees. The defaults
        # give wayland-egl, wayland-vulkan and the HUD -- 68 of the shell's 136
        # translation units. The DRM backends, the compositor, the software
        # backend, headless-vulkan, the watchdog and accessibility were all
        # unscanned.
        #
        # That is not hypothetical. Alert #547 reported GetEncodableInt as
        # unreachable in watchdog_plugin.cc; its three callers sit behind
        # #if BUILD_WATCHDOG, which this build did not set, so they were not
        # compiled and the function genuinely looked dead. A blind spot that
        # invents a false positive will equally hide a real one.
        #
        # BUILD_BACKEND_HEADLESS_EGL stays off: it needs a v4l2-webrtc-codec
        # checkout beside this repo (cmake/options.cmake:228), and fetching a
        # second source tree to widen a scan is a worse trade than the one
        # backend it adds. Same for accesskit, which wants a downloaded SDK.
        cmake -GNinja \
          -B ${{github.workspace}}/build/release \
          -D CMAKE_BUILD_TYPE=Release \
          -D CMAKE_STAGING_PREFIX=${{github.workspace}}/build/staging/usr/local \
          -D BUILD_NUMBER=${GITHUB_RUN_ID} \
          -D BUILD_BACKEND_WAYLAND_EGL=ON \
          -D BUILD_BACKEND_WAYLAND_VULKAN=ON \
          -D BUILD_BACKEND_DRM_KMS_EGL=ON \
          -D BUILD_BACKEND_DRM_KMS_VULKAN=ON \
          -D BUILD_BACKEND_SOFTWARE=ON \
          -D BUILD_SOFTWARE_SINK_DRM=ON \
          -D BUILD_BACKEND_HEADLESS_VULKAN=ON \
          -D BUILD_COMPOSITOR=ON \
          -D BUILD_WATCHDOG=ON \
          -D BUILD_ACCESSIBILITY=ON

    - name: Build Release Packages
      working-directory: ${{github.workspace}}/build/release
      run: |
        rm -rf _packages || true
        ninja -C . package
        ls -la _packages

    # Analyze but do not upload: the SARIF is filtered first (next step).
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        upload: never
        output: ${{ runner.temp }}/codeql-sarif

    # Drop results outside our own source before the dashboard ever sees them.
    #
    # paths-ignore cannot do this. It applies to interpreted languages, or to a
    # compiled language analyzed *without* building -- and this workflow builds,
    # so every third_party submodule compiled into the shell gets extracted and
    # reported. Enabling the DRM backends brought drm-cxx and friends in, which
    # is 922 vendored alerts against 27 of our own: a dashboard nobody reads.
    #
    # Two prefixes go:
    #   third_party/  vendored submodules -- we do not patch them here, and a
    #                 submodule bump would otherwise refill the dashboard.
    #   build/        generated sources (e.g. the wlcxxgen wayland-protocols
    #                 headers), which are build output, not code to review.
    #
    # Filtering rather than dismissing also retires what is already recorded:
    # an alert absent from a later analysis of the same tool/category/ref is
    # closed as fixed, so the existing vendored alerts age out on their own.
    - name: Drop vendored and generated results from the SARIF
      run: |
        set -euo pipefail
        shopt -s nullglob
        # Anchored on a path separator rather than the string start: Code'L may
        # emit a URI relative to the source root or an absolute one (which is
        # why upload-sarif has a checkout_path input), and a start-anchored
        # match would silently keep everything in the absolute case. The
        # trailing slash is what keeps a file merely NAMED third_party_*.cc.
        drop='(^|/)(third_party|build)/'
        found=0
        for f in "${{ runner.temp }}"/codeql-sarif/*.sarif; do
          found=1
          before=$(jq '[.runs[].results[]] | length' "$f")
          # Log what is going, so a wrong assumption about the URI shape shows
          # up as "dropped 0" beside an empty list instead of passing quietly.
          jq -r --arg drop "$drop" '
            [ .runs[].results[]
              | .locations[]?.physicalLocation.artifactLocation.uri // ""
              | select(test($drop))
            ] | unique | .[] | "  dropping: \(.)"
          ' "$f" | head -20
          jq --arg drop "$drop" '
            .runs |= map(
              .results |= map(select(
                [ .locations[]?.physicalLocation.artifactLocation.uri // ""
                  | test($drop) ] | any | not
              ))
            )
          ' "$f" > "$f.filtered"
          mv "$f.filtered" "$f"
          after=$(jq '[.runs[].results[]] | length' "$f")
          echo "$(basename "$f"): kept $after of $before (dropped $((before - after)))"
        done
        if [ "$found" -eq 0 ]; then
          echo "no SARIF produced in ${{ runner.temp }}/codeql-sarif" >&2
          exit 1
        fi

    - name: Upload filtered results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/codeql-sarif
        category: "/language:${{matrix.language}}"
