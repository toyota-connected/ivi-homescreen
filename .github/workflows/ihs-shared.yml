---
name: ihs-shared

# Gates for the ihs_shared FFI ABI. Both jobs build shared/ standalone (it
# establishes its own project() when it is the top-level source), so they need
# only a C++ toolchain, CMake, and libdl — no Wayland / Flutter / DRM stack.
#
#  - consumer-smoke : install the CMake package, compile every installed header
#    as strict C11, then build an out-of-tree consumer via find_package and run
#    it (version handshake + trace + config round-trip + logging), with
#    ENABLE_DLT both on and off.
#  - abi-gate : abidiff the built libihs_shared.so against the committed ABI
#    baseline; fail on an incompatible (non-additive) change. The baseline lives
#    at shared/abi/libihs_shared.so.abi; the job bootstraps it on first run.

on:
  pull_request:
    paths:
      - 'shared/**'
      - 'shell/logging/**'
      - '.github/workflows/ihs-shared.yml'
  push:
    branches:
      - v2.0
      - v3.0
    paths:
      - 'shared/**'
      - 'shell/logging/**'
      - '.github/workflows/ihs-shared.yml'
  workflow_dispatch:

jobs:
  consumer-smoke:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        enable_dlt: [ON, OFF]
    name: "consumer-smoke DLT=${{ matrix.enable_dlt }}"
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        uses: ./.github/actions/apt-packages
        with:
          packages: >-
            cmake ninja-build g++

      - name: Build + install ihs_shared
        run: |
          # ENABLE_OSGI so ihs_osgi.h is installed: it is what the osgi_abi
          # conformance step below builds against, and it puts that header
          # through the C11 check that follows -- which is what keeps it
          # parseable by ffigen, the tool that would remove the hand-written
          # Dart mirrors entirely.
          cmake -S shared -B build -G Ninja \
            -DENABLE_DLT=${{ matrix.enable_dlt }} \
            -DENABLE_OSGI=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build
          cmake --install build

      - name: Installed headers compile as C11
        run: |
          for h in prefix/include/ihs/*.h; do
            echo "  $h"
            gcc -x c -std=c11 -fsyntax-only -Iprefix/include "$h"
          done

      - name: Out-of-tree consumer via find_package
        run: |
          cmake -S shared/tests/consumer -B cbuild -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build cbuild
          export LD_LIBRARY_PATH="$PWD/prefix/lib:$PWD/prefix/lib64:$PWD/prefix/lib/x86_64-linux-gnu"
          ctest --test-dir cbuild --output-on-failure

      - name: End-to-end logging sinks (console / file / level / fallback)
        # Logging is always compiled in; only the DLT sink is gated by
        # ENABLE_DLT. Both matrix legs run the scenarios -- on the DLT=OFF leg
        # the fallback scenario also covers the "dlt requested, not built"
        # warn-and-fall-back-to-console path.
        run: |
          cmake -S shared/tests/sink_integration -B sbuild -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build sbuild
          export LD_LIBRARY_PATH="$PWD/prefix/lib:$PWD/prefix/lib64:$PWD/prefix/lib/x86_64-linux-gnu"
          ctest --test-dir sbuild --output-on-failure

      - name: OSGi ABI conformance (struct layout + status values)
        # dart:ffi cannot read a C header, so every Dart caller mirrors
        # IhsOsgiPeerInfo / IhsOsgiBundleInfo by hand. struct_size catches a
        # struct that shrank; it cannot catch a field that moved, which keeps
        # the same size and then writes a port id over a pointer. This pins the
        # layout from the C side; the Dart side pins the same numbers in
        # packages/osgi_ffi/test/abi_conformance_test.dart over in dart_osgi.
        run: |
          cmake -S shared/tests/osgi_abi -B obuild -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build obuild
          export LD_LIBRARY_PATH="$PWD/prefix/lib:$PWD/prefix/lib64:$PWD/prefix/lib/x86_64-linux-gnu"
          ctest --test-dir obuild --output-on-failure

      - name: Location unit tests (parser / registry / manager / fallback / filter / file / kalman / ctrv / wire)
        # Standalone: compiles the internal location sources directly (ParseTpv,
        # registry, manager, etc. are not part of the installed C ABI), so no
        # prefix / gpsd is needed. ctest runs every add_test in the project.
        run: |
          cmake -S shared/tests/location -B lbuild -G Ninja
          cmake --build lbuild
          ctest --test-dir lbuild --output-on-failure

  # Producer-latency regression guard for the shell logging path. Links the
  # installed libihs_shared (real cross-.so FFI) and asserts the per-call cost
  # stays within a same-machine ratio of raw fmt formatting, so a future change
  # that makes logging synchronous or adds a lock/alloc/syscall to the hot path
  # fails here. Runner-independent (ratio, not absolute ns).
  logging-bench:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Fetch fmt submodule (raw-fmt reference)
        run: git submodule update --init --depth 1 third_party/fmt

      - name: Install build deps
        uses: ./.github/actions/apt-packages
        with:
          packages: >-
            cmake ninja-build g++

      - name: Build + install ihs_shared
        run: |
          cmake -S shared -B build -G Ninja -DENABLE_DLT=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build
          cmake --install build

      - name: Build + run the logging producer-latency guard
        run: |
          cmake -S shell/logging/tests/bench -B bbuild -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/prefix" -DIHS_ROOT="$PWD"
          cmake --build bbuild
          export LD_LIBRARY_PATH="$PWD/prefix/lib:$PWD/prefix/lib64:$PWD/prefix/lib/x86_64-linux-gnu"
          ctest --test-dir bbuild --output-on-failure

  abi-gate:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        uses: ./.github/actions/apt-packages
        with:
          packages: >-
            cmake ninja-build g++ abigail-tools

      - name: Build ihs_shared
        run: |
          cmake -S shared -B build -G Ninja -DENABLE_DLT=ON
          cmake --build build

      - name: Locate the built library
        id: lib
        run: |
          so=$(find build -name 'libihs_shared.so.*.*' | head -n1)
          test -n "$so" || { echo "libihs_shared.so not found"; exit 1; }
          echo "path=$so" >> "$GITHUB_OUTPUT"

      - name: ABI diff against the committed baseline
        run: |
          baseline=shared/abi/libihs_shared.so.abi
          current='${{ steps.lib.outputs.path }}'
          if [ ! -f "$baseline" ]; then
            echo "::warning::No ABI baseline at $baseline — generating one."
            mkdir -p shared/abi
            abidw --out-file "$baseline" "$current"
            echo "Baseline generated. Commit it to enable the ABI gate:"
            cat "$baseline"
            exit 1
          fi
          # abidiff exit is a bitfield; bit 3 (value 8) is an ABI-incompatible
          # (non-additive) change. Additive-only changes (new exports) pass.
          set +e
          abidiff --no-added-syms "$baseline" "$current"
          rc=$?
          set -e
          echo "abidiff rc=$rc"
          if [ $(( rc & 8 )) -ne 0 ]; then
            echo "::error::Incompatible ABI change without a version bump."
            exit 1
          fi

      - name: Upload baseline artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ihs-shared-abi
          path: shared/abi/libihs_shared.so.abi
          if-no-files-found: ignore

  # Opt-in real-wire test: the DLT sink through an actual dlt-daemon, captured
  # with dlt-receive. Not a per-PR gate (daemon startup timing is flaky); runs
  # on demand and post-merge. The deterministic DLT emit path is covered per-PR
  # by the load harness against a libdlt stub.
  dlt-daemon-e2e:
    if: >-
      ${{ github.server_url == 'https://github.com' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        uses: ./.github/actions/apt-packages
        with:
          packages: >-
            cmake ninja-build gcc g++ dlt-daemon dlt-tools

      - name: Build + install ihs_shared
        run: |
          cmake -S shared -B build -G Ninja -DENABLE_DLT=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build
          cmake --install build

      - name: Compile a marker logger
        run: |
          cat > driver.c <<'EOF'
          #include <stdio.h>
          #include "ihs/logging.h"
          int main(void) {
            if (ihs_log_start("IHSC", "dlt e2e") != 1) return 1;
            const int32_t c = ihs_log_context_open("E2ET", NULL);
            if (c < 0) return 1;
            const char m[] = "dlt-e2e-marker-9f3a";
            for (int i = 0; i < 40; ++i) ihs_log(c, 4 /*info*/, m, sizeof(m) - 1);
            ihs_log_flush();
            ihs_log_stop();
            return 0;
          }
          EOF
          gcc -std=c11 -Iprefix/include driver.c -o driver \
            -Lprefix/lib -Lprefix/lib64 -lihs_shared

      - name: Run dlt-daemon + capture the marker
        run: |
          export LD_LIBRARY_PATH="$PWD/prefix/lib:$PWD/prefix/lib64:$PWD/prefix/lib/x86_64-linux-gnu"

          # This job had never run before the workflow gained a v3.0 push
          # trigger -- it is gated to push/workflow_dispatch, and the workflow
          # pushed only on v2.0 -- and the first times it ran it died here:
          #
          #   ~DLT~ ERROR    ~FIFO user dir /tmp/dltpipes cannot be chmoded
          #                   (Operation not permitted)!
          #   ~DLT~ CRITICAL ~Initialization of phase 1 failed!
          #
          # The runner logged the cause: /tmp/dltpipes arrives owned by _dlt,
          # the system user the dlt-daemon package creates, while the job runs
          # as runner. chmod returns EPERM to anyone who is not the owner
          # whatever the mode -- that directory is 01777 and refuses it anyway
          # -- so this is ownership, and the sudo chmod that fixed /dev/dri in
          # #545 and #554 would leave it exactly as broken.
          #
          # Deleting it worked but only moved the problem: -t defaults to /tmp,
          # and the daemon puts its local fifo (/tmp/dlt) beside the user-pipes
          # dir (/tmp/dltpipes) under it. Clearing one left the other owned by
          # _dlt, and the daemon started and then could not open /tmp/dlt,
          # losing every message the driver sent.
          #
          # So give both ends a directory this job owns outright. -t moves the
          # daemon's fifo and user-pipes together, and DLT_PIPE_DIR is how
          # dlt-daemon --help says a client is pointed at the same place. That
          # leaves the package's /tmp paths untouched rather than racing another
          # user for them.
          PIPE_DIR="$PWD/dltpipes"
          mkdir -p "$PIPE_DIR"
          echo "running as: $(id -un) ($(id -u))"
          ls -ld /tmp/dltpipes 2>/dev/null || echo "/tmp/dltpipes: absent"
          ls -ld /tmp/dlt 2>/dev/null || echo "/tmp/dlt: absent"
          ls -ld "$PIPE_DIR"

          # Something else on this runner already speaks DLT. The previous
          # attempt's capture carried applications this job never launched --
          # 'DBUS' (PID 2944) and 'SYS' (PID 2945), the package's dlt-dbus and
          # dlt-system -- along with "Daemon launched" from a daemon that was
          # not ours. dlt-receive reaches the daemon over TCP 3490, so it was
          # talking to whichever one owned that port, and `pgrep -x dlt-daemon`
          # matched that one too: the readiness check was passing on a process
          # this step never started, against a daemon still using /tmp.
          #
          # So state what is running, stop it, and start our own with a pid we
          # hold. The runner is not systemd-booted -- the daemon says so on
          # every start -- so these are ordinary processes, not units.
          echo "--- before ---"
          pgrep -a dlt-daemon || echo "  no dlt-daemon running"
          pgrep -a dlt-system || echo "  no dlt-system running"
          pgrep -a dlt-dbus   || echo "  no dlt-dbus running"
          ss -ltnp 2>/dev/null | grep ':3490' || echo "  port 3490 free"
          sudo pkill -x dlt-daemon 2>/dev/null || true
          sudo pkill -f dlt-system 2>/dev/null || true
          sudo pkill -f dlt-dbus   2>/dev/null || true
          sleep 1
          echo "--- after stop ---"
          pgrep -a dlt-daemon || echo "  no dlt-daemon running"
          ss -ltnp 2>/dev/null | grep ':3490' || echo "  port 3490 free"

          # Foreground with & rather than -d, so the pid is ours to check.
          # Daemonising hands back a pid that has already exited, which is what
          # left the previous check matching an unrelated process. -e is on, so
          # a daemon that dies still has to be caught explicitly here or the
          # marker grep reports it as "marker not received" -- a different
          # problem from the one that happened.
          dlt-daemon -t "$PIPE_DIR" > daemon.log 2>&1 &
          DLT_PID=$!
          for _ in $(seq 1 20); do
            kill -0 "$DLT_PID" 2>/dev/null && [ -p "$PIPE_DIR/dlt" ] && break
            sleep 0.5
          done
          if ! kill -0 "$DLT_PID" 2>/dev/null; then
            echo "::error::dlt-daemon (pid $DLT_PID) exited during startup"
            cat daemon.log || true
            exit 1
          fi
          if [ ! -p "$PIPE_DIR/dlt" ]; then
            echo "::error::dlt-daemon is running but $PIPE_DIR/dlt is not a fifo"
            ls -la "$PIPE_DIR" || true
            cat daemon.log || true
            exit 1
          fi
          echo "dlt-daemon up as pid $DLT_PID; $(ls -ld "$PIPE_DIR")"
          ls -la "$PIPE_DIR" || true
          cat daemon.log || true
          # TCP on 3490, so the capture side is unaffected by the pipe dir.
          dlt-receive -a localhost > capture.txt 2>&1 &
          RECV=$!
          sleep 2
          # DLT_PIPE_DIR is the client half of -t: without it the driver would
          # look in /tmp while the daemon listens here, and the marker would go
          # missing for a reason that looks nothing like a path mismatch.
          IHS_LOG_SINK=dlt DLT_PIPE_DIR="$PIPE_DIR" ./driver
          sleep 3
          kill "$RECV" 2>/dev/null || true
          kill "$DLT_PID" 2>/dev/null || true
          echo "=== dlt-receive capture (tail) ==="; tail -n 40 capture.txt || true
          if ! grep -q "dlt-e2e-marker-9f3a" capture.txt; then
            echo "::error::marker was not received by dlt-daemon"
            exit 1
          fi
          echo "dlt-daemon received the marker"
