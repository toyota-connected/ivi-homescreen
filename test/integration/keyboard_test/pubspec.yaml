name: keyboard_test
description: Integration test app for the ivi-homescreen keyboard pipeline.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: AppText
      fonts:
        - asset: fonts/DejaVuSans.ttf
    - family: AppMono
      fonts:
        - asset: fonts/DejaVuSansMono.ttf
    - family: NotoColorEmoji
      fonts:
        - asset: fonts/NotoColorEmoji.ttf
