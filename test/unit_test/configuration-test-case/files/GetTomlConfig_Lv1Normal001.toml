[global]
app_id = 'gallery'
cursor_theme = 'Coolbeans'
disable_cursor = true
wayland_event_mask = 'keyboard'
debug_backend = false

[view]
output_index = 2
width = 1920
height = 1080
pixel_ratio = 4.5
accessibility_features = 52
fullscreen = false

  [view.args]
  engine = ['--enable-asserts', '--verbose-logging']

  [view.shell]
  surface_id = 5002

    [view.shell.window]
    type = 'NORMAL'

      [view.shell.window.activation_area]
      x = 10        # x location
      y = 10        # y location
      width = 1024
      height = 768
