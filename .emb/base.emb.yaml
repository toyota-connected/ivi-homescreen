# Shared base for the ivi-homescreen board manifests in this .emb/ directory.
#
# emb (emb_cli) auto-discovers `.emb/` when you run `emb cross` against the
# project root and deep-merges each <board>.emb.yaml over this base. Each board
# file's target name is its filename (e.g. zero3.emb.yaml -> `--target zero3`),
# or a `cross.targets` key. Build from the repo root (the directory that holds
# CMakeLists.txt), which is what emb uses as the CMake source:
#
#   emb cross . --list-targets
#   emb cross . --target zero3 --build --backend software \
#       --app ../micro_cluster --mode release --deploy radxa@radxa-zero3.lan
#   emb cross . --build                 # native host build of every backend below
#
# `base.emb.yaml` is the reserved base filename and is never itself a target.
id: ivi-homescreen
type: app
supported_archs: [arm64, x86_64]
supported_host_types: [fedora, ubuntu]

cross:
  # `provider` is required only to parse this block; it is ignored for the
  # native (`--target local`, the default) build, which uses the host toolchain.
  # Every board target overrides it with its own provider.
  provider: arm-gnu
  # Embedder binary, relative to each backend build dir. Setting it explicitly
  # lets --run/--deploy/--deb locate `homescreen` directly instead of scanning
  # the build tree (which can otherwise hit a CMake compiler-probe binary).
  package:
    name: ivi-homescreen
    bin: shell/homescreen
    files:
      # crashpad_handler is a separate runtime executable staged into the augment
      # overlay by sentry-native (not a link input), so it ships explicitly.
      # Gated on the same define as the augment below.
      overlay/usr/bin/crashpad_handler:
        to: /usr/bin/crashpad_handler
        mode: "0755"
        requires_define: BUILD_CRASH_HANDLER
  # Optional native crash handler (sentry-native + crashpad), inherited by every
  # target. Off by default; enable per invocation with
  # `--define BUILD_CRASH_HANDLER=ON`. The curl transport needs libcurl at
  # runtime, which the board dev_packages already carry (libcurl4-openssl-dev).
  augment:
    - pkg: sentry-native
      requires_define: BUILD_CRASH_HANDLER
      min: "0.15.3"
      url: https://github.com/getsentry/sentry-native/releases/download/0.15.3/sentry-native.zip
      build: cmake
      static: true
      defines:
        SENTRY_BACKEND: crashpad
        SENTRY_TRANSPORT: curl
        SENTRY_BUILD_SHARED_LIBS: 'OFF'
        SENTRY_BUILD_TESTS: 'OFF'
        SENTRY_BUILD_EXAMPLES: 'OFF'
    # AccessKit C bindings, for the platform accessibility adapter. Off by
    # default; enable with `--define BUILD_ACCESSKIT=ON` (which also requires
    # BUILD_ACCESSIBILITY, since the adapter reads the semantics tree).
    #
    # Built from source rather than unpacked: the release ships prebuilt
    # libraries for linux/x86_64 and linux/x86 only, and accesskit.cmake maps
    # aarch64 to a lib/linux/arm64 directory the archive does not contain, so a
    # board build would configure and then fail to find the library. Building
    # the crate gives every target a library for its own architecture, at the
    # cost of a Rust toolchain -- the package pulls Corrosion and compiles with
    # cargo, and the target's Rust std must be installed
    # (`rustup target add aarch64-unknown-linux-gnu` for the boards here).
    #
    # The patch is what makes the package usable as an augment at all. Upstream
    # installs back into its own source tree and never installs its CMake
    # config, so an overlay build would leave the sysroot empty; the patch adds
    # an opt-in conventional layout and a config find_package can resolve. It
    # also gives Corrosion the cross triple, without which cargo builds host
    # objects while the toolchain points at the cross compiler.
    - pkg: accesskit-c
      requires_define: BUILD_ACCESSKIT
      min: "0.22.3"
      url: https://github.com/AccessKit/accesskit-c/releases/download/0.22.3/accesskit-c-0.22.3.zip
      build: cmake
      static: true
      patches:
        - patches/accesskit-c-0001-prefix-install-and-cross-target.patch
      defines:
        ACCESSKIT_INSTALL_PREFIX_LAYOUT: 'ON'
        # The archive carries pre-generated headers; regenerating them needs a
        # pinned nightly Rust plus cbindgen and clang-format, which is not a
        # dependency worth taking on for a header that is already correct.
        ACCESSKIT_BUILD_HEADERS: 'OFF'
        ACCESSKIT_BUILD_LIBRARIES: 'ON'
  defines:
    DISABLE_PLUGINS: 'ON'              # shared by the native build and the boards
  # Native host backend matrix: `emb cross . --build` (no --target) compiles
  # every backend with the host toolchain — the dev compile smoke-test. A board
  # target declares its own cross.backends, which REPLACES this set (it does not
  # union), so a board never inherits these host-only entries.
  backends:
    wayland-egl:
      BUILD_BACKEND_WAYLAND_EGL: 'ON'
      BUILD_BACKEND_WAYLAND_VULKAN: 'OFF'
    wayland-vulkan:
      BUILD_BACKEND_WAYLAND_EGL: 'OFF'
      BUILD_BACKEND_WAYLAND_VULKAN: 'ON'
    drm-kms-egl:
      BUILD_BACKEND_DRM_KMS_EGL: 'ON'
      BUILD_BACKEND_WAYLAND_EGL: 'OFF'
      BUILD_BACKEND_WAYLAND_VULKAN: 'OFF'
    drm-kms-vulkan:
      BUILD_BACKEND_DRM_KMS_VULKAN: 'ON'
      BUILD_BACKEND_WAYLAND_EGL: 'OFF'
      BUILD_BACKEND_WAYLAND_VULKAN: 'OFF'
    software:
      BUILD_BACKEND_SOFTWARE: 'ON'
      BUILD_BACKEND_WAYLAND_EGL: 'OFF'
      BUILD_BACKEND_WAYLAND_VULKAN: 'OFF'
